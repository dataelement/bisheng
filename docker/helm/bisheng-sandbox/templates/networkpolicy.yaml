{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bisheng-sandbox.fullname" . }}
  labels:
    {{- include "bisheng-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bisheng-sandbox.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.denyEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
{{- if .Values.networkPolicy.allowFrom }}
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
{{- else }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, worker, linsight]
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  {{- if .Values.networkPolicy.denyEgress }}
  egress: []
  {{- end }}
{{- end }}
