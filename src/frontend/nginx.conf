# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}



server {
	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 3001;

	# 管理端整体挂在 /platform 下（与 vite BASE_URL 一致）。
	# 页面、静态资源、语言包、接口都收在同一个前缀里，外层系统反代时
	# 只需要一条 location，不必再把 /assets、/api 这些根路径逐个代理。
	location = / {
		return 301 /platform/;
	}

	location = /platform {
		return 301 /platform/;
	}

	# root（而非 alias）：产物目录本来就叫 platform，用 root 让 /platform/x
	# 直接落到 .../html/platform/x，同时避开 alias 与 try_files 组合的老问题。
	location /platform/ {
		root /usr/share/nginx/html;
		index index.html index.htm;
		try_files $uri $uri/ /platform/index.html;
		add_header X-Frame-Options SAMEORIGIN;
	}

	# 客户端聊天仍在根路径的 /workspace，不随管理端迁移：
	# 首钢门户等外部集成都按这个地址在用。
	location /workspace/ {
		alias /usr/share/nginx/html/client/;
		index index.html index.htm;
		try_files $uri $uri/ /workspace/index.html;
	}

	# 两个前缀都要剥掉再转后端：管理端走 /platform/api，客户端走 /workspace/api。
	location ~ ^(/platform|/workspace)?/api(/|$) {
		rewrite ^(?:/platform|/workspace)(/.*)$ $1 break;
		proxy_pass http://backend:7860;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 1024m;
		add_header Access-Control-Allow-Origin $host;
		add_header X-Frame-Options SAMEORIGIN;
	}

	# MinIO 对象：后端下发的多为绝对地址（根路径），但经 axios 发出的相对请求
	# 会带上管理端前缀，所以两种都接。
	location ~ ^(?:/platform|/workspace)?/(bisheng|tmp-dir)/ {
		rewrite ^(?:/platform|/workspace)(/.*)$ $1 break;
		proxy_pass http://minio:9000;
	}
}
