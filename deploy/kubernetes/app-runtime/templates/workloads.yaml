---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-admission
  namespace: {{ .Values.services.namespace }}
spec:
  replicas: {{ .Values.services.admissionReplicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: runtime-admission}}
  template:
    metadata:
      labels: {app: runtime-admission}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: {{ .Values.execution.architecture }}
{{- if .Values.services.pullSecret }}
      imagePullSecrets: [{name: {{ .Values.services.pullSecret }}}]
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: runtime-admission
          image: {{ .Values.images.admission | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, runtime_manager.k8s_admission]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: service, containerPort: 8443}]
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 512Mi}
          env:
            - name: RTM_ADMISSION_PLATFORM_URL
              value: {{ .Values.platform.origin | quote }}
            - name: RTM_ADMISSION_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: admission-key-id}
            - name: RTM_ADMISSION_SECRET_FILE
              value: /run/admission-identity/secret
            - name: RTM_ADMISSION_PLATFORM_CA_FILE
              value: /run/platform-ca/ca.crt
            - name: RTM_K8S_NAMESPACE
              value: {{ .Values.execution.namespace | quote }}
            - name: RTM_ADMISSION_MANAGER_USERNAME
              value: {{ printf "system:serviceaccount:%s:%s" .Values.services.namespace .Values.services.managerAccount | quote }}
            - name: RTM_ADMISSION_STATUS_POLICY_REVISION
              value: {{ .Values.execution.statusPolicyRevision | quote }}
            - name: RTM_ADMISSION_CNI_USERNAME
              value: {{ .Values.execution.cniUsername | quote }}
            - name: RTM_STORAGE_CONTROLLER_USERNAMES
              value: {{ .Values.execution.storageControllerUsernames | toJson | quote }}
            - name: RTM_DATA_PUBLIC_KEYS_CONFIGMAP
              value: {{ .Values.execution.dataKeyConfigMap | quote }}
            - name: RTM_ADMISSION_TLS_CERT_FILE
              value: /run/admission-tls/tls.crt
            - name: RTM_ADMISSION_TLS_KEY_FILE
              value: /run/admission-tls/tls.key
            - name: RTM_ADMISSION_HELPER_IMAGE
              value: {{ .Values.images.helper | quote }}
            - name: RTM_ADMISSION_CANARY_PLANS_FILE
              value: /run/preflight/plans.json
          readinessProbe:
            httpGet: {path: /health, port: service, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /health, port: service, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: platform-ca, mountPath: /run/platform-ca, readOnly: true}
            - {name: admission-identity, mountPath: /run/admission-identity, readOnly: true}
            - {name: admission-tls, mountPath: /run/admission-tls, readOnly: true}
            - {name: canary-plans, mountPath: /run/preflight, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: platform-ca
          configMap:
            name: {{ .Values.platform.caConfigMap }}
            defaultMode: 0444
            items: [{key: ca.crt, path: ca.crt}]
        - name: admission-identity
          secret:
            secretName: {{ .Values.services.credentialsSecret }}
            defaultMode: 0440
            items: [{key: admission-secret, path: secret}]
        - name: admission-tls
          secret:
            secretName: {{ .Values.services.admissionTlsSecret }}
            defaultMode: 0440
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        - name: canary-plans
          configMap:
            name: runtime-canary-plans
            defaultMode: 0444
