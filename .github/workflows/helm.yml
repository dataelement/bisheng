name: Standard Helm source checks
on:
  pull_request:
    paths: ['docker/helm/**', 'deploy/kubernetes/app-runtime/**', 'scripts/package_helm.py', 'scripts/verify_k8s_runtime.py', 'src/runtime-manager/runtime_manager/**', 'src/backend/bisheng/app_runtime/domain/schemas/runtime_delivery.py', 'scripts/tests/test_*helm*.py', '.github/workflows/helm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: python -m pip install pytest PyYAML jsonschema
      - run: python -m pytest scripts/tests/test_standard_helm.py scripts/tests/test_helm_package.py -q
# Source checks use explicit fictitious digest fixtures. They do not publish
# packages, build/push images, access credentials or deploy a cluster.
