# Merge into docker/gateway/config/application.yml; retain all existing sections.
# Add kunlian under an existing custom key if present; do not duplicate custom.
custom:
  kunlian:
    enabled: false
    connection-id: kunlian-workflow
    issuer: https://idp.example.com
    client-id: REPLACE_CLIENT_ID
    allowed-tenant-id: REPLACE_EXTERNAL_TENANT_ID
    allowed-workspace-ids:
      - REPLACE_WORKSPACE_ID
    public-origin: https://workflow.example.com
    redirect-uri: https://workflow.example.com/api/kunlian/callback
    logout-redirect-uri: https://workflow.example.com/api/kunlian/logout/callback
    backend-base-url: http://backend:7860
    approved-service-origins:
      - http://backend:7860
    approved-test-origins: []
    endpoint-allowlist:
      - https://idp.example.com/.well-known/openid-configuration
      - https://idp.example.com/oidc/authorize
      - https://idp.example.com/oidc/token
      - https://idp.example.com/oidc/jwks
      - https://idp.example.com/oidc/logout
    client-secret-reference: env:KUNLIAN_CLIENT_SECRET
    internal-key-id: kunlian-internal-v1
    internal-secret-reference: env:KUNLIAN_INTERNAL_SECRET
    transaction-encryption-secret-reference: env:KUNLIAN_GATEWAY_TRANSACTION_KEY
