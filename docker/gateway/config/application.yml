# Contract: bisheng-gateway v1.8.0 (2995df6f); Docker-only addresses.
server:
  port: 8080
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: gateway
  codec:
    max-in-memory-size: 200MB
  cloud:
    gateway:
      httpclient:
        connect-timeout: 30000
        response-timeout: 3600s
        websocket:
          max-frame-payload-length: 1048576
      routes:
        - id: bisheng-http
          uri: http://backend:7860
          filters:
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
          predicates:
            - Path=/api/v1/**,/api/v2/**,/api/v3/**
        - id: bisheng-ws
          uri: ws://backend:7860
          filters:
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
          predicates:
            - Path=/api/v1/chat/**,/api/v2/chat/**,/api/v1/workflow/chat/**,/api/v3/assistant/chat/**,/api/v3/workflow/chat/**
      global-filter:
        websocket-routing:
          enabled: false
  web:
    resources:
      add-mappings: false
  data:
    redis:
      host: redis
      port: 6379
      database: 3
  datasource:
    username: bisheng_gateway
    password: ${GATEWAY_DATABASE_PASSWORD}
    url: jdbc:mysql://mysql:3306/bisheng_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
logging:
  level:
    root: info
bisheng:
  license: ${BISHENG_LICENSE}
  gateway-hmac-secret: ${BISHENG_GATEWAY_HMAC_SECRET}
  signature-header: X-Signature
  home-url: ${BISHENG_PUBLIC_URL}
  web-home-url: ${BISHENG_PUBLIC_URL}
  bisheng-api-url: http://backend:7860
  enable-sync: false
  time: 1
  filter-url:
    - api/v1/assistant/chat/
    - api/v1/process/
    - api/v2/assistant/chat
  websocket:
    anonymous-path-prefixes:
      - /api/v2
      - /api/v3/assistant/chat
      - /api/v3/workflow/chat
