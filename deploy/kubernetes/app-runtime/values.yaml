# Public example passwords must be changed; install crypto roots are generated once.
platform:
  origin: ''
  backendBase: ''
  caConfigMap: ''
services:
  namespace: ''
  credentialsSecret: ''
  materialIssuerSecret: ''
  admissionTlsSecret: ''
  managerAccount: ''
  pullSecret: ''
  managerReplicas: 1
  entryReplicas: 1
  egressReplicas: 1
  admissionReplicas: 2
  managerType: ClusterIP
  managerNodePort: 30091
  entryType: ClusterIP
  entryNodePort: 30080
  egressClusterIP: ''
  resources: {}
  placement:
    nodeSelector: {}
    affinity: {}
    tolerations: []
  probes:
    readiness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 6
    startup:
      periodSeconds: 5
      failureThreshold: 60
      timeoutSeconds: 2
  apiTimeoutSeconds: 10
  dnsTimeoutSeconds: 120
execution:
  namespace: ''
  clusterId: bisheng-k8s
  nodeId: ''
  installationId: ''
  architecture: amd64
  memoryBudgetMi: 4096
  cpuBudgetMillicores: 4000
  maxPods: 64
  temporaryStorageMi: 4096
  runtimeClass: ''
  sandbox: default
  runtimeClasses:
    recommended: ''
    hardened: ''
  statusPolicyRevision: v1
  cniUsername: ''
  storageControllerUsernames:
  - system:kube-controller-manager
  - system:kube-scheduler
  pullSecret: ''
  dataKeyConfigMap: ''
  dataPublicKeys: {}
  probeReport: {}
  canaryPlans: {}
  canaryProfiles: []
  helperResources:
    image-check:
      memory_mb: 256
      cpu_millicores: 1000
    prepare-download:
      memory_mb: 128
      cpu_millicores: 100
    prepare-install:
      memory_mb: 1024
      cpu_millicores: 1000
    prepare-upload:
      memory_mb: 128
      cpu_millicores: 100
    assemble:
      memory_mb: 1024
      cpu_millicores: 1000
    data:
      memory_mb: 128
      cpu_millicores: 100
    sidecar:
      memory_mb: 128
      cpu_millicores: 25
    init:
      memory_mb: 128
      cpu_millicores: 25
  timeouts:
    image_check: 120
    init_phase: 90
    health: 90
  placement:
    nodeSelector: {}
    affinity: {}
    tolerations: []
  operationTimeoutSeconds: 1800
images:
  manager: ''
  entry: ''
  egress: ''
  admission: ''
  helper: ''
  assembler: ''
network:
  podCidrs: []
  serviceCidrs: []
  controlAllowedCidrs: []
  entryAllowedCidrs: []
  kubernetesApiCidrs: []
  dnsCidrs: []
  backendCidrs: []
  backendPorts:
  - 443
  - 7860
  egressPorts:
  - 80
  - 443
  apiServer: https://kubernetes.default.svc
  platformPodPort: 8443
storage:
  className: null
  sizeMi: 1024
  scratchSizeMi: 4096
  filesystem: ext4
  sqliteCompatible: false
  nodeLocal: false
  localRoot: /var/lib/bisheng-runtime
  volumes: []
admission:
  caBundle: ''
  timeoutSeconds: 5
  managedByParent: false
offline:
  enabled: true
  packageIndex: ''
  extraPackageIndex: ''
  npmRegistry: ''
  packageEndpoints: []
  imageRepository: ''
  imageRegistryEndpoints: []
  registrySecret: ''
  insecureRegistry: false
namespaceManagement:
  createControl: false
  createExecution: true
diagnostics:
  enabled: false
