{{- if not .Values.token.existingSecret -}}
{{- $name := include "bisheng-sandbox.fullname" . -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := default (randAlphaNum 64) .Values.token.value | b64enc -}}
{{- if $old -}}
{{- if or (ne (get (default (dict) $old.metadata.annotations) "meta.helm.sh/release-name") .Release.Name) (ne (get (default (dict) $old.metadata.annotations) "meta.helm.sh/release-namespace") .Release.Namespace) (not (hasKey $old.data "token")) }}{{ fail "sandbox token ownership/content mismatch; refusing rotation" }}{{ end -}}
{{- $token = get $old.data "token" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations: {helm.sh/resource-policy: keep}
  labels: {{ include "bisheng-sandbox.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | quote }}
{{- end }}
