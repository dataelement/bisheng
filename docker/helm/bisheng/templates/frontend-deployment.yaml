apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bisheng.frontendService" . }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "bisheng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print .Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        deployment.bisheng.io/config-revision: {{ .Values.global.configRevision | quote }}
      labels:
        {{- include "bisheng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
{{- with (concat .Values.global.imagePullSecrets .Values.imagePullSecrets) }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: frontend
          image: {{ include "bisheng.image" (list . .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.frontend.service.port }}}
{{- if .Values.frontend.service.clientPort }}
            - {name: client, containerPort: {{ .Values.frontend.service.clientPort }}}
{{- end }}
{{- if .Values.runtime.enabled }}
            - {name: internal-tls, containerPort: {{ .Values.global.internalPlatformPort }}}
{{- end }}
          resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
{{- with .Values.frontend.startupProbe }}
          startupProbe: {{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.frontend.readinessProbe }}
          readinessProbe: {{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.frontend.livenessProbe }}
          livenessProbe: {{ toYaml . | nindent 12 }}
{{- end }}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
{{- if .Values.runtime.enabled }}
            - {name: internal-tls, mountPath: /run/internal-tls, readOnly: true}
{{- end }}
      volumes:
        - name: nginx
          configMap: {name: {{ include "bisheng.component" (list . "nginx") }}}
{{- if .Values.runtime.enabled }}
        - name: internal-tls
          secret:
            secretName: {{ default (include "bisheng.component" (list . "internal-tls")) .Values.global.credentials.existingTlsSecret }}
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
{{- end }}
{{- with .Values.frontend.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.frontend.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.frontend.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
{{- end }}
