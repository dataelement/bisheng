{{- include "runtime.defaults" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runtime.name" (list . "runtime-deployment-descriptor") }}
  namespace: {{ .Values.services.namespace }}
data:
  descriptor.json: {{ include "runtime.policy" . | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime.name" (list . "runtime-manager") }}
  namespace: {{ .Values.services.namespace }}
spec:
  replicas: {{ .Values.services.managerReplicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "runtime.name" (list . "runtime-manager") }}}}
  template:
    metadata:
      annotations:
        checksum/deployment-policy: {{ include "runtime.policy" . | sha256sum }}
        deployment.bisheng.io/config-revision: {{ default "" (get (default (dict) .Values.global) "configRevision") | quote }}
      labels: {app: {{ include "runtime.name" (list . "runtime-manager") }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: {{ .Values.execution.architecture }}
{{- with .Values.services.placement.nodeSelector }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.services.placement.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.services.placement.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
{{- end }}
{{- $pull := default (list) (get (default (dict) .Values.global) "imagePullSecrets") }}
{{- if .Values.services.pullSecret }}{{ $pull = append $pull (dict "name" .Values.services.pullSecret) }}{{ end }}
{{- with $pull }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ .Values.services.managerAccount }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ include "runtime.name" (list . "runtime-manager") }}
          image: {{ .Values.images.manager | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, runtime_manager.k8s_boot]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: service, containerPort: 8091}]
          resources:
{{ toYaml (default (dict "requests" (dict "cpu" "100m" "memory" "128Mi" "ephemeral-storage" "64Mi") "limits" (dict "cpu" "1" "memory" "512Mi" "ephemeral-storage" "512Mi")) .Values.services.resources.manager) | nindent 12 }}
          env:
            - name: RTM_HOST
              value: 0.0.0.0
            - name: RTM_PORT
              value: "8091"
            - name: RTM_EXECUTOR
              value: kubernetes
            - name: RTM_DATA_ROOT
              value: /tmp/runtime
            - name: RTM_PLATFORM_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: manager-key-id}
            - name: RTM_PLATFORM_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: manager-secret}
            - name: RTM_INBOUND_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: control-key-id}
            - name: RTM_INBOUND_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: control-secret}
            - name: RTM_MATERIAL_ISSUER_KEY_FILE
              value: /run/material-issuer/seed
            - name: RTM_K8S_SANDBOX
              value: {{ .Values.execution.sandbox | quote }}
            - name: RTM_K8S_NAMESPACE
              value: {{ .Values.execution.namespace | quote }}
            - name: RTM_K8S_CLUSTER_ID
              value: {{ .Values.execution.clusterId | quote }}
            - name: RTM_K8S_DIAGNOSTIC_FILE
              value: /run/diagnostics/report.json
            - name: RTM_K8S_DEPLOYMENT_DESCRIPTOR
              value: /run/deployment/descriptor.json
            - {name: RTM_K8S_REQUEST_TIMEOUT_SECONDS, value: {{ .Values.services.apiTimeoutSeconds | quote }}}
            - {name: RTM_EGRESS_DNS_TIMEOUT, value: {{ .Values.services.dnsTimeoutSeconds | quote }}}
            - name: RTM_K8S_API_SERVER
              value: {{ .Values.network.apiServer | quote }}
            - name: RTM_K8S_TOKEN_FILE
              value: /run/kubernetes/token
            - name: RTM_K8S_CA_FILE
              value: /run/kubernetes/ca.crt
            - name: RTM_EGRESS_PROXY
              value: {{ printf "%s.%s.svc:3128" (include "runtime.name" (list . "egress-proxy")) .Values.services.namespace | quote }}
            - name: RTM_BUILD_INDEX_URL
              value: {{ .Values.offline.packageIndex | quote }}
            - name: RTM_BUILD_EXTRA_INDEX_URL
              value: {{ .Values.offline.extraPackageIndex | quote }}
            - name: RTM_BUILD_NPM_REGISTRY
              value: {{ .Values.offline.npmRegistry | quote }}
            - name: RTM_PROTOCOL_VERSION
              value: "2"
            - name: RTM_NODE_ID
              value: {{ .Values.execution.nodeId | quote }}
            - name: RTM_PLATFORM_BASE_URL
              value: {{ .Values.platform.origin | quote }}
            - name: RTM_PLATFORM_CA_FILE
              value: /run/platform-ca/ca.crt
          startupProbe:
            httpGet: {path: /healthz, port: service}
{{ toYaml .Values.services.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: service}
{{ toYaml .Values.services.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: service}
{{ toYaml .Values.services.probes.liveness | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: platform-ca, mountPath: /run/platform-ca, readOnly: true}
            - {name: kubernetes, mountPath: /run/kubernetes, readOnly: true}
            - {name: descriptor, mountPath: /run/deployment, readOnly: true}
            - {name: diagnostics, mountPath: /run/diagnostics, readOnly: true}
            - {name: material-issuer, mountPath: /run/material-issuer, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
        - name: platform-ca
          configMap:
            name: {{ .Values.platform.caConfigMap }}
            defaultMode: 0444
            items: [{key: ca.crt, path: ca.crt}]
        - name: kubernetes
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
        - name: diagnostics
          configMap:
            name: {{ include "runtime.name" (list . "runtime-diagnostics") }}
            optional: true
        - name: descriptor
          configMap:
            name: {{ include "runtime.name" (list . "runtime-deployment-descriptor") }}
            defaultMode: 0444
        - name: material-issuer
          secret:
            secretName: {{ .Values.services.materialIssuerSecret }}
            defaultMode: 0440
            items: [{key: seed, path: seed}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime.name" (list . "app-proxy") }}
  namespace: {{ .Values.services.namespace }}
spec:
  replicas: {{ .Values.services.entryReplicas }}
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "runtime.name" (list . "app-proxy") }}}}
  template:
    metadata:
      annotations:
        checksum/deployment-policy: {{ include "runtime.policy" . | sha256sum }}
        deployment.bisheng.io/config-revision: {{ default "" (get (default (dict) .Values.global) "configRevision") | quote }}
      labels: {app: {{ include "runtime.name" (list . "app-proxy") }}}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: {{ .Values.execution.architecture }}
{{- with .Values.services.placement.nodeSelector }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.services.placement.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.services.placement.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
{{- end }}
{{- $pull := default (list) (get (default (dict) .Values.global) "imagePullSecrets") }}
{{- if .Values.services.pullSecret }}{{ $pull = append $pull (dict "name" .Values.services.pullSecret) }}{{ end }}
{{- with $pull }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ include "runtime.name" (list . "app-proxy") }}
          image: {{ .Values.images.entry | quote }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, uvicorn, "app_proxy.main:app", --host, 0.0.0.0, --port, "8080", --no-access-log]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: service, containerPort: 8080}]
          resources:
{{ toYaml (default (dict "requests" (dict "cpu" "100m" "memory" "128Mi" "ephemeral-storage" "64Mi") "limits" (dict "cpu" "1" "memory" "512Mi" "ephemeral-storage" "512Mi")) .Values.services.resources.entry) | nindent 12 }}
          env:
            - name: APP_PROXY_HOST
              value: 0.0.0.0
            - name: APP_PROXY_PORT
              value: "8080"
            - name: APP_PROXY_PROTOCOL_VERSION
              value: "2"
            - name: APP_PROXY_BACKEND_BASE
              value: {{ .Values.platform.backendBase | quote }}
            - name: APP_PROXY_MANAGER_BASE
              value: {{ printf "http://%s.%s.svc:8091" (include "runtime.name" (list . "runtime-manager")) .Values.services.namespace | quote }}
            - name: SSL_CERT_FILE
              value: /run/platform-ca/ca.crt
            - name: APP_PROXY_BACKEND_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: authz-secret}
            - name: APP_PROXY_MANAGER_SECRET
              value: ""
            - name: APP_PROXY_ROUTE_KEY_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: entry-key-id}
            - name: APP_PROXY_ROUTE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.services.credentialsSecret }}, key: entry-secret}
          startupProbe:
            httpGet: {path: /healthz, port: service}
{{ toYaml .Values.services.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: service}
{{ toYaml .Values.services.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: service}
{{ toYaml .Values.services.probes.liveness | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: platform-ca, mountPath: /run/platform-ca, readOnly: true}
      volumes:
        - name: platform-ca
          configMap: {name: {{ .Values.platform.caConfigMap }}}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
