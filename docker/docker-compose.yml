services:
  mysql:
    container_name: bisheng-mysql
    image: mysql:8.0
    
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"  # 数据库密码，如果修改需要同步修改bisheng/congfig/config.yaml配置database_url的mysql连接密码
      MYSQL_DATABASE: bisheng
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/mysql/conf/my.cnf:/etc/mysql/my.cnf
      - ${DOCKER_VOLUME_DIRECTORY:-.}/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p$$MYSQL_ROOT_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS openfga;'"]
      start_period: 30s
      interval: 20s
      timeout: 10s
      retries: 4
    restart: on-failure

  openfga-migrate:
    container_name: bisheng-openfga-migrate
    # Formal deployments set OPENFGA_IMAGE to the reviewed v1.15.1 tag@digest.
    # The default remains version-pinned for local development; ``latest`` is forbidden.
    image: ${OPENFGA_IMAGE:-openfga/openfga:v1.15.1}
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: mysql
      OPENFGA_DATASTORE_URI: "root:1234@tcp(mysql:3306)/openfga?parseTime=true"
    depends_on:
      mysql:
        condition: service_healthy

  openfga:
    container_name: bisheng-openfga
    image: ${OPENFGA_IMAGE:-openfga/openfga:v1.15.1}
    command: run
    environment:
      OPENFGA_DATASTORE_METRICS_ENABLED: "true"
      OPENFGA_DATASTORE_ENGINE: mysql
      OPENFGA_DATASTORE_URI: "root:1234@tcp(mysql:3306)/openfga?parseTime=true"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "true"
      OPENFGA_CHECK_QUERY_CACHE_TTL: 30s
      OPENFGA_CHECK_ITERATOR_CACHE_ENABLED: "true"
      OPENFGA_CHECK_ITERATOR_CACHE_TTL: 30s
      OPENFGA_CHECK_ITERATOR_CACHE_MAX_RESULTS: 10000
      OPENFGA_CACHE_CONTROLLER_ENABLED: "true"
      OPENFGA_CACHE_CONTROLLER_TTL: 10s
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: 80
      OPENFGA_DATASTORE_MAX_IDLE_CONNS: 40
      OPENFGA_METRICS_ENABLE_RPC_HISTOGRAMS: "true"
      OPENFGA_RESOLVE_NODE_LIMIT: "${OPENFGA_RESOLVE_NODE_LIMIT:-25}"
      OPENFGA_LIST_OBJECTS_MAX_RESULTS: 1000
    ports:
      - "8080:8080"
      - "8081:8081"
      - "2112:2112"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    # 不在 compose 里写 HEALTHCHECK：openfga 官方镜像为 distroless，无 /bin/sh、无 wget，
    # CMD-SHELL 会永久 unhealthy。未定义时 Compose 将 ``service_healthy`` 视为已启动即可。
    restart: unless-stopped

  redis:
    container_name: bisheng-redis
    image: redis:7.0.4
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/redis:/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/redis/redis.conf:/etc/redis.conf
    command: redis-server /etc/redis.conf
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli ping|grep -e "PONG\|NOAUTH"']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: on-failure

  backend:
    container_name: bisheng-backend
    image: dataelement/bisheng-backend:v3.0.0-beta1
    ports:
      - "7860:7860"
    environment:
      TZ: Asia/Shanghai
      BS_SSO_SYNC__GATEWAY_HMAC_SECRET: "bisheng-local-hmac-20260422"
      BS_MILVUS_CONNECTION_ARGS: '{"host":"milvus","port":"19530","user":"","password":"","secure":false}'
      BS_MILVUS_IS_PARTITION: 'true'
      BS_MILVUS_PARTITION_SUFFIX: '1'
      BS_ELASTICSEARCH_URL: 'http://elasticsearch:9200'
      BS_ELASTICSEARCH_SSL_VERIFY: '{}'  # 可根据自己部署的密码进行配置 '{"basic_auth": ("elastic", "elastic")}'
      BS_MINIO_SCHEMA: 'false'
      BS_MINIO_CERT_CHECK: 'false'
      BS_MINIO_ENDPOINT: 'minio:9000'
      BS_MINIO_SHAREPOINT: 'minio:9000'
      BS_MINIO_ACCESS_KEY: 'minioadmin'
      BS_MINIO_SECRET_KEY: 'minioadmin'
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/config/config.yaml:/app/bisheng/config.yaml
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/entrypoint.sh:/app/entrypoint.sh
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/bisheng:/app/data
    security_opt:
      - seccomp:unconfined
    command: sh entrypoint.sh api  # 启动api服务
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      start_period: 30s
      interval: 90s
      timeout: 30s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # openfga 官方镜像无 HEALTHCHECK，Compose v5 无法用 service_healthy
      openfga:
        condition: service_started

  backend_worker:
    container_name: bisheng-backend-worker
    image: dataelement/bisheng-backend:v3.0.0-beta1
    environment:
      TZ: Asia/Shanghai
      BS_SSO_SYNC__GATEWAY_HMAC_SECRET: "bisheng-local-hmac-20260422"
      BS_MILVUS_CONNECTION_ARGS: '{"host":"milvus","port":"19530","user":"","password":"","secure":false}'
      BS_MILVUS_IS_PARTITION: 'true'
      BS_MILVUS_PARTITION_SUFFIX: '1'
      BS_ELASTICSEARCH_URL: 'http://elasticsearch:9200'
      BS_ELASTICSEARCH_SSL_VERIFY: '{}'  # 可根据自己部署的密码进行配置 '{"basic_auth": ("elastic", "elastic")}'
      BS_MINIO_SCHEMA: 'false'
      BS_MINIO_CERT_CHECK: 'false'
      BS_MINIO_ENDPOINT: 'minio:9000'
      BS_MINIO_SHAREPOINT: 'minio:9000'
      BS_MINIO_ACCESS_KEY: 'minioadmin'
      BS_MINIO_SECRET_KEY: 'minioadmin'
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/config/config.yaml:/app/bisheng/config.yaml
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/entrypoint.sh:/app/entrypoint.sh
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/bisheng:/app/data
    security_opt:
      - seccomp:unconfined
    command: sh entrypoint.sh worker  # 启动celery的异步worker服务，用来处理一些耗时的任务
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      openfga:
        condition: service_started

  frontend:
    container_name: bisheng-frontend
    image: dataelement/bisheng-frontend:v3.0.0-beta1
    ports:
      - "3001:3001"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ${DOCKER_VOLUME_DIRECTORY:-.}/nginx/conf.d:/etc/nginx/conf.d
    restart: on-failure
    depends_on:
      - backend

  elasticsearch:
    container_name: bisheng-es
    image: docker.io/bitnamilegacy/elasticsearch:8.12.0
    user: root
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/es:/bitnami/elasticsearch/data
    restart: on-failure

  etcd:
    container_name: bisheng-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: on-failure
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: bisheng-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: bisheng-milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/milvus:/var/lib/milvus
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      start_period: 90s
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # ── 应用工场运行时层（F054 T074 / T077 / T078）──────────────────────
  # 四个 service 都挂在 `app-runtime` profile 后面：**「整层不装」是产品明确
  # 支持的形态**（GOV-10 / AC-59）。不带 --profile app-runtime 启动时它们根本
  # 不创建，平台其余部分零变化——这正是 nginx 的 `location /apps/` 必须用
  # 变量式 upstream 的原因（静态主机名解析不了会让 nginx 整个起不来）。
  #
  # 四者都**不 publish 端口**：外部流量一律经 frontend 的 nginx 进来；
  # docker-socket-proxy 与 egress-proxy 更是连内网都只对本层可见。
  runtime-manager:
    container_name: bisheng-runtime-manager
    profiles: [app-runtime]
    build:
      context: ../src/runtime-manager
    environment:
      TZ: Asia/Shanghai
      RTM_HOST: '0.0.0.0'
      RTM_PORT: '8091'
      # 必须与 backend 的 app_runtime.manager_hmac_secret 一致。不一致的症状是
      # 所有编排意图被回 401，而 backend 会把它折叠成 16121「编排器不可用」——
      # 排查时容易误判成 dockerd 挂了。
      RTM_HMAC_SECRET: ${BISHENG_RTM_HMAC_SECRET:-}
      # ⚠️ 这两个变量指的是**同一个目录的两种视角**，必须同时给。
      #   RTM_DATA_ROOT       = 本容器内看到的路径（进程自己 mkdir/chown/读写用）
      #   RTM_HOST_DATA_ROOT  = 宿主上看到的路径（交给宿主 dockerd 做 bind 用）
      # runtime-manager 通过 docker.sock 让**宿主 dockerd** 创建应用容器，
      # HostConfig.Binds 由宿主解释；只给 RTM_DATA_ROOT 的话宿主会在
      # /app-data/... 凭空建一个空目录，应用照样起、探活照样过，只是它的
      # SQLite 落在谁也不看的地方。systemd 形态两者相同，所以那边可以不设。
      RTM_DATA_ROOT: /app-data
      RTM_HOST_DATA_ROOT: ${BISHENG_APP_DATA_ROOT:-/opt/bisheng/app-data}
      # 容量准入与构建源。这里是它们**唯一**生效的位置：判定发生在本进程里，
      # backend 的 config.yaml 看不到也管不着。默认值即代码里的出厂值，改了要
      # 重启本服务（配置在进程启动时读一次）。
      #   RESERVE_MB       闸①：先从宿主 MemAvailable 扣掉的余量，按 available 配不按总量配
      #   OVERCOMMIT_RATIO 闸②：已承诺规格之和的天花板比例，(0, 1]
      #   BUILD_RESERVE_MB 构建同样过闸，按此预留（pip install 的内存尖峰）
      #   BUILD_INDEX_URL  构建期注入容器的 PIP_INDEX_URL（python3.11 模板）；内网/离线填私有源
      #   BUILD_NPM_REGISTRY 同上，node20 模板的 npm 源；static 模板不拉任何包
      RTM_RESERVE_MB: ${BISHENG_RTM_RESERVE_MB:-2048}
      RTM_OVERCOMMIT_RATIO: ${BISHENG_RTM_OVERCOMMIT_RATIO:-0.8}
      RTM_BUILD_RESERVE_MB: ${BISHENG_RTM_BUILD_RESERVE_MB:-2048}
      RTM_BUILD_INDEX_URL: ${BISHENG_RTM_BUILD_INDEX_URL:-}
      RTM_BUILD_NPM_REGISTRY: ${BISHENG_RTM_BUILD_NPM_REGISTRY:-}
      # 托管应用附件存储句柄（F054 AC-45）。**独立 bucket `bisheng-apps`**，不是平台
      # 的 `bisheng` 桶：nginx 的 `location /bisheng/` 会把任意 key 转发给 MinIO，附件
      # 放进去等于只剩桶策略这一道墙（design 坑 20）。新桶不挂 nginx location、
      # 不设匿名策略，由 runtime-manager 首次使用时自动创建。
      # 不配 MinIO 三项 = 句柄仍注入应用，但所有存储调用答 503，
      # `runtime/status` 的 preflight `attachment_storage` 会指出来。
      RTM_MINIO_ENDPOINT: 'minio:9000'
      RTM_MINIO_ACCESS_KEY: 'minioadmin'
      RTM_MINIO_SECRET_KEY: 'minioadmin'
      RTM_STORAGE_BUCKET: bisheng-apps
      RTM_STORAGE_MAX_FILE_MB: ${BISHENG_RTM_STORAGE_MAX_FILE_MB:-20}
      # 应用容器访问本进程的地址（注入为 BISHENG_APP_STORAGE_ENDPOINT 的前缀）。
      # compose 下应用容器和本服务同在 bisheng-apps 网络，服务名可解析；
      # systemd 形态要写 bisheng-apps 网桥网关地址（127.0.0.1 容器里够不到）。
      RTM_APP_FACING_BASE_URL: 'http://runtime-manager:8091'
      # D2-B（T078）：编排访问面不再是整块 root 等价权限，而是端点白名单。
      # **本进程零代码改动**——只是换一个 base URL，docker_backend.py 的
      # 那层 Protocol 存在的全部理由就是这一行能这么改。
      RTM_DOCKER_HOST: 'tcp://docker-socket-proxy:2375'
      # D12（T077）出站白名单。给的是**应用容器视角**的地址：它们和本服务、
      # egress-proxy 同在 bisheng-apps 网络上，服务名可解析。
      # 留空 = 整层没部署，`runtime/status` 的 preflight 会直说「托管应用出站
      # 不受限」——没有「开关打开但代理不存在」这种能把出站全掐死的组合。
      RTM_EGRESS_PROXY: 'egress-proxy:3128'
      # 构建期在自己的 --internal 网络上跑，出口同样只有 egress-proxy，
      # 所以注入的 HTTP_PROXY/HTTPS_PROXY build arg 是强制而不是建议。
      RTM_BUILD_NETWORK: bisheng-build
      # L3 兜底（DOCKER-USER / nft）要用的应用网段。compose 形态下由 docker 自
      # 动分配，装好后用 `docker network inspect bisheng-apps` 读出来写回这里；
      # 留空则 preflight 明说「L3 没生成，白名单全靠 --internal」。
      RTM_APPS_SUBNET: ${BISHENG_RTM_APPS_SUBNET:-}
      # 留空 = 探测。Docker 29 起默认 nftables 后端**没有 DOCKER-USER 链**
      # （design 坑 22），iptables 规则会「下发成功」却不生效，所以探测结果是
      # nftables 时 preflight 直接判红，而不是假装装好了。
      RTM_FIREWALL_BACKEND: ${BISHENG_RTM_FIREWALL_BACKEND:-}
      # 构建期能访问的平台自身分发端点（装 bisheng-sdk 用，AC-16）。
      RTM_PLATFORM_BASE_URL: 'http://backend:7860'
      RTM_EGRESS_ALLOW: ${BISHENG_RTM_EGRESS_ALLOW:-}
      RTM_EGRESS_BUILD_ALLOW: ${BISHENG_RTM_EGRESS_BUILD_ALLOW:-}
      RTM_EGRESS_LISTEN: '0.0.0.0:3128'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # ⚠️ docker socket **不再直挂**（D2-B，T078）：编排走
      # docker-socket-proxy 的端点白名单。全平台仍然只有那一个容器持有 socket，
      # 而它是一个没有业务代码、只做 HTTP 转发的镜像。
      # 源路径写成与 RTM_HOST_DATA_ROOT **逐字相同的表达式**，这样两者不可能漂移。
      # 不能沿用 ${DOCKER_VOLUME_DIRECTORY:-.}：它默认是相对路径 `.`，compose 自己
      # 会相对本文件解析，但作为环境变量原样传进去后 dockerd 只接受绝对路径。
      - ${BISHENG_APP_DATA_ROOT:-/opt/bisheng/app-data}:/app-data
    networks:
      # default：backend / app-proxy 靠服务名找它。
      # bisheng-apps：启动探活是 manager 进程**直接 HTTP 访问应用容器在该网络上的
      # bridge IP**（probe.py:95），不在这张网上就永远探不通。
      - default
      - bisheng-apps
    depends_on:
      - docker-socket-proxy
    restart: on-failure

  # D2-B：把「全有全无的 root 等价权限」收成端点级。放行的端点由
  # runtime_manager.docker_backend.SOCKET_PROXY_PERMISSIONS 唯一定义，
  # tests/test_socket_proxy.py 逐字比对本段——改一边不改另一边测试就红。
  # **绝不 publish 端口**：谁够得到 2375 谁就是这台机器的 root。
  docker-socket-proxy:
    container_name: bisheng-docker-socket-proxy
    profiles: [app-runtime]
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      ALLOW_RESTARTS: "0"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      AUTH: "0"
      BUILD: "1"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "1"
      INFO: "0"
      NETWORKS: "1"
      NODES: "0"
      PING: "1"
      PLUGINS: "0"
      POST: "1"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "0"
      VOLUMES: "0"
    volumes:
      # :ro 只挡文件系统写，不挡 API 写——真正的收窄是上面那张表。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: on-failure

  # D12 L2：托管应用出站的唯一出口。它自己就是 runtime-manager 那个镜像，跑
  # 另一个入口点——策略文件是两者之间的全部契约，所以编排器重启不会把所有应用
  # 的出站一起带走。
  # 它**同时**接在 bisheng-apps（--internal，应用只够得到它）与 default
  #（有默认路由，能真的出网）上——「内网 + 唯一出口」这句话的字面落点。
  egress-proxy:
    container_name: bisheng-egress-proxy
    profiles: [app-runtime]
    build:
      context: ../src/runtime-manager
    command: ["python", "-m", "runtime_manager.egress_proxy"]
    environment:
      TZ: Asia/Shanghai
      RTM_HOST: '0.0.0.0'
      RTM_PORT: '8091'
      RTM_HMAC_SECRET: ${BISHENG_RTM_HMAC_SECRET:-}
      # 与 runtime-manager 同一份 data root：策略文件就在 {data_root}/egress/。
      RTM_DATA_ROOT: /app-data
      RTM_HOST_DATA_ROOT: ${BISHENG_APP_DATA_ROOT:-/opt/bisheng/app-data}
      RTM_EGRESS_PROXY: 'egress-proxy:3128'
      RTM_EGRESS_LISTEN: '0.0.0.0:3128'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${BISHENG_APP_DATA_ROOT:-/opt/bisheng/app-data}:/app-data
    networks:
      - default
      - bisheng-apps
      - bisheng-build
    restart: on-failure

  app-proxy:
    container_name: bisheng-app-proxy
    profiles: [app-runtime]
    build:
      context: ../src/app-proxy
    environment:
      TZ: Asia/Shanghai
      APP_PROXY_HOST: '0.0.0.0'
      APP_PROXY_PORT: '8090'
      # ⚠️ 变量名以 app_proxy/config.py 顶部的契约表为准，**不要照猜**。曾经写成
      # APP_PROXY_BACKEND_BASE_URL / APP_PROXY_HMAC_SECRET：进程照常启动、容器
      # healthy，但两个 base 都停在 127.0.0.1 默认值、两个密钥都是空串（fail
      # closed），于是**每个请求都渲染「暂时无法访问」**。同样的坑 systemd 那份
      # 单元文件（features/v3.0.0/054-app-domain-runtime/deploy/）里逐字记着。
      APP_PROXY_BACKEND_BASE: 'http://backend:7860'
      APP_PROXY_MANAGER_BASE: 'http://runtime-manager:8091'
      # 与 backend 的 app_runtime.proxy_hmac_secret 一致。
      APP_PROXY_BACKEND_SECRET: ${BISHENG_APP_PROXY_HMAC_SECRET:-}
      # 与 backend 的 app_runtime.manager_hmac_secret 一致 = runtime-manager 的
      # RTM_HMAC_SECRET，同一把密钥，别再生成第二个。
      APP_PROXY_MANAGER_SECRET: ${BISHENG_RTM_HMAC_SECRET:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      # default：nginx 用 `app-proxy` 这个服务名做变量式 upstream 解析
      #（docker/nginx/conf.d/default.conf:65-67），backend 也在这张网上。
      # bisheng-apps：它拿到的 upstream 是应用容器的 bridge IP（design D5.1），
      # 跨 bridge 网络会被 docker 的隔离规则丢包，必须同网。
      - default
      - bisheng-apps
    # 每个请求都要向 backend 问一次入口判定（3s 缓存 × 30s 宽限）。
    # runtime-manager 是路由表的唯一真相（design D5.1），一起排序。
    depends_on:
      - backend
      - runtime-manager
    restart: on-failure
    # 刻意**不挂** docker socket：它只做解析路由 / 剥头 / 注入身份 / 转发，
    # 给它编排权限是纯粹的权限扩散。

# ── 托管应用专用网络 ────────────────────────────────────────────────────
# runtime-manager 只**读**这张网（docker_backend.py:161-166「网络由部署方创建」），
# 它绝不自己建——一个会偷偷建网的编排器会把"新机器上第一次发布必挂"这件事藏起来。
# 那么 compose 形态下的"部署方"就是这个文件。
#
# `name:` 必须显式写死：compose 默认会加项目名前缀（docker_bisheng-apps），而
# runtime-manager 是用裸 Docker API 建应用容器的，NetworkMode 取的是
# RTM_NETWORK / DEFAULT_NETWORK = `bisheng-apps` 这个真名，对不上就 404 network
# not found，每次 deploy 都失败。
#
# 两个 service 都显式列了 `networks:`，这是有意的：一旦给 service 写了 networks，
# 它就**不再自动接 default**，而 nginx→app-proxy、backend→runtime-manager 都靠
# default 上的服务名解析，所以两张网都得列上。
#
# `internal: true` = D12 的 L1（AC-16）。接在这张网上的容器**没有默认路由**，
# 所以托管应用连不上外网；唯一出口是同时接了 default 的 egress-proxy。
# ⚠️ 这个属性只在建网时生效：升级到本版本的环境里 `bisheng-apps` 已经存在且
# 不是 internal，compose 不会去改它，`runtime/status` 的
# `application_network_internal` 会判红并给出重建命令。删网前要先停掉全部
# 托管应用（网络在用时删不掉）。
networks:
  bisheng-apps:
    name: bisheng-apps
    driver: bridge
    internal: true
  # 构建期专用（RTM_BUILD_NETWORK）。同样 --internal：`docker build` 拿到的
  # HTTP_PROXY build arg 因此不是「建议」——忽略它的 Dockerfile 根本没有路由。
  # 只有 egress-proxy 在这张网上，构建容器连 runtime-manager 都够不到。
  bisheng-build:
    name: bisheng-build
    driver: bridge
    internal: true
