# Place these locations in the existing BISHENG server block.
# The forecast service stays on the platform's private network.
location ^~ /workspace/procurement-forecast-tools/ {
    proxy_pass http://procurement-forecast:8786/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 50s;
    client_max_body_size 300k;
    add_header Cache-Control "no-store" always;
}

location ^~ /workspace/procurement-forecast/ {
    proxy_pass http://procurement-forecast:8786/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 50s;
    client_max_body_size 300k;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-store" always;
}
