{{- include "bisheng.runtimeDefaults" . -}}
{{- $root := . -}}
{{- if not .Values.global.credentials.existingPlatformSecret }}
{{ include "bisheng.ownedSecret" (list . (include "bisheng.component" (list . "platform-keys")) (dict "jwt-secret" (randAlphaNum 64 | b64enc) "gateway-hmac" (randAlphaNum 64 | b64enc))) }}
{{- end }}
{{- range $name, $value := dict "db-platform" .Values.database "redis-auth" .Values.redis "minio-auth" .Values.minio -}}
{{- if not $value.auth.existingSecret -}}
{{- $data := dict -}}
{{- if eq $name "minio-auth" -}}
{{- $_ := set $data $value.auth.accessKeyKey ($value.auth.accessKey | b64enc) -}}
{{- $_ := set $data $value.auth.secretKeyKey ($value.auth.secretKey | b64enc) -}}
{{- else -}}{{- $_ := set $data $value.auth.passwordKey ($value.auth.password | b64enc) -}}{{- end }}
{{ include "bisheng.ownedSecret" (list $root (include "bisheng.component" (list $root $name)) $data) }}
{{- end -}}{{- end -}}
{{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret) }}
{{ include "bisheng.ownedSecret" (list . (include "bisheng.component" (list . "mysql-root")) (dict .Values.mysql.auth.rootPasswordKey (.Values.mysql.auth.rootPassword | b64enc))) }}
{{- end }}
{{- range $name := list "openfga" "gateway" -}}
{{- $value := index $root.Values $name -}}
{{- if and $value.enabled (not $value.database.auth.existingSecret) }}
{{ include "bisheng.ownedSecret" (list $root (include "bisheng.component" (list $root (printf "db-%s" $name))) (dict $value.database.auth.passwordKey ($value.database.auth.password | b64enc))) }}
{{- end -}}{{- end -}}
{{- if .Values.runtime.enabled -}}
{{- $data := dict -}}
{{- range $role := list "manager" "control" "entry" "egress" "admission" -}}
{{- $_ := set $data (printf "%s-key-id" $role) ($role | b64enc) -}}
{{- $_ := set $data (printf "%s-secret" $role) (randAlphaNum 64 | b64enc) -}}
{{- end -}}
{{- $_ := set $data "authz-secret" (randAlphaNum 64 | b64enc) -}}
{{- $_ := set $data "obo-secret" (randAlphaNum 64 | b64enc) -}}
{{- $_ := set $data "payload-key" (randBytes 32 | b64enc) -}}
{{- if not .Values.global.credentials.existingRuntimeSecret }}
{{ include "bisheng.ownedSecret" (list . .Values.runtime.services.credentialsSecret $data) }}
{{- end }}
{{- if not .Values.global.credentials.existingIssuerSecret }}
{{ include "bisheng.ownedSecret" (list . .Values.runtime.services.materialIssuerSecret (dict "seed" (randBytes 32))) }}
{{- end }}
{{- if not .Values.global.credentials.existingDataSecret }}
{{ include "bisheng.ownedSecret" (list . (include "runtime.name" (list . "data-signing")) (dict "seed" (randBytes 32))) }}
{{- end }}
{{- $context := dict "Release" .Release "Values" .Values.runtime "Chart" .Chart -}}
{{- if .Values.global.credentials.existingTlsSecret -}}
{{- if not (and .Values.global.credentials.existingAdmissionTlsSecret .Values.global.credentials.existingCaConfigMap .Values.global.credentials.caBundle) }}{{ fail "external TLS requires frontend/admission Secrets, public CA ConfigMap and caBundle" }}{{ end }}
{{ include "runtime.admission" (list $context .Values.global.credentials.caBundle) }}
{{- else -}}
{{- $tlsName := include "bisheng.component" (list . "internal-tls") -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $tlsName -}}
{{- $ca := genCA (printf "%s-internal" (include "bisheng.fullname" .)) 3650 -}}
{{- if $old }}{{ $ca = buildCustomCert (get $old.data "ca.crt") (get $old.data "ca.key") }}{{ end -}}
{{- $front := include "bisheng.component" (list . "internal") -}}
{{- $leaf := genSignedCert $front nil (list $front (printf "%s.%s.svc" $front .Release.Namespace) (printf "%s.%s.svc.%s" $front .Release.Namespace .Values.global.clusterDomain)) 825 $ca -}}
{{- $tlsData := dict "ca.crt" ($ca.Cert | b64enc) "ca.key" ($ca.Key | b64enc) "tls.crt" ($leaf.Cert | b64enc) "tls.key" ($leaf.Key | b64enc) -}}
{{ include "bisheng.ownedSecret" (list . $tlsName $tlsData) }}
{{- $admission := include "runtime.name" (list . "runtime-admission") -}}
{{- $cert := genSignedCert $admission nil (list $admission (printf "%s.%s.svc" $admission .Release.Namespace) (printf "%s.%s.svc.%s" $admission .Release.Namespace .Values.global.clusterDomain)) 825 $ca -}}
{{ include "bisheng.ownedSecret" (list . .Values.runtime.services.admissionTlsSecret (dict "tls.crt" ($cert.Cert | b64enc) "tls.key" ($cert.Key | b64enc))) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.runtime.platform.caConfigMap }}
data:
  ca.crt: {{ $ca.Cert | quote }}
{{ include "runtime.admission" (list $context ($ca.Cert | b64enc)) }}
{{- end }}
{{- end }}
