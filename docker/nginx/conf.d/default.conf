
# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}


upstream backend_server {
	server backend:7860;  # backend api
}


server {
	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 3001;

	 location / {
		root /usr/share/nginx/html/platform;
		index index.html index.htm;
		# 禁止浏览器缓存 index.html
		location = /index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /index.html;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location /workspace/ {
		alias /usr/share/nginx/html/client/;
		index index.html index.htm;
		# 禁止浏览器缓存 /workspace/index.html
		location = /workspace/index.html {
			add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
			add_header Pragma "no-cache" always;
			add_header Expires 0 always;
		}
		try_files $uri $uri/ /workspace/index.html;
	}


	# ── 托管应用入口（F054 T073 / design D5）────────────────────────────
	# 前缀匹配，比 `/` 长故优先于 platform 的 SPA fallback；与正则
	# `~ ^(/workspace)?/api(/|$)` 不冲突（正则只吃 /api）。
	#
	# ⚠️ upstream 必须走**变量 + resolver 延迟解析**，不能写成静态
	# `proxy_pass http://app-proxy:8090`。nginx 在 **config load 时**解析静态
	# proxy_pass 里的主机名；而 app-proxy 挂在 `app-runtime` profile 后面，
	# 「整层不装」是产品明确支持的形态（GOV-10）。一旦它没起，静态写法会让
	# **整个 nginx 起不来** —— 症状是升级后前端全站白屏，而不是「托管应用打不开」。
	# 变量式 proxy_pass 把解析推迟到请求期，解析失败只影响这一个 location。
	#
	# 变量式 proxy_pass **不会**自动带上原始 URI，必须显式拼 $request_uri
	# （它已含 query string）。app-proxy 自己剥 /apps/{slug} 前缀，所以这里
	# 原样透传，不做 rewrite。
	location /apps/ {
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $bisheng_app_proxy http://app-proxy:8090;
		proxy_pass $bisheng_app_proxy$request_uri;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# 托管应用可能用 WebSocket（复用文件顶部的 map）。
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# 应用可能长轮询或流式输出；缓冲会把流式响应攒成一坨。
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
		proxy_buffering off;
		client_max_body_size 1024m;

		# 只兜 nginx 自己产生的错误（上游连不上）。**刻意不开
		# proxy_intercept_errors** —— 开了会把应用自己返回的 502/503 也换成
		# 平台的兜底页，那是在替应用说谎。
		error_page 502 503 504 = @apps_unavailable;
	}

	# 「工场运行时层未部署 / 暂不可用」的引导页，由 backend 渲染（T035）。
	location @apps_unavailable {
		# ⚠️ 命名 location 里的 proxy_pass **不能带 URI 部分**
		# （nginx: "proxy_pass cannot have URI part in ... named location"），
		# 所以目标路径只能靠 rewrite 设定。写成
		# `proxy_pass http://backend_server/api/v1/apps/_unavailable` 会让整个
		# nginx 起不来——本文件已实测过一次。
		rewrite ^ /api/v1/apps/_unavailable break;
		proxy_pass http://backend_server;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location ~ ^(/workspace)?/api(/|$) {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://backend_server;
		proxy_read_timeout 300s;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 1024m;
		add_header Access-Control-Allow-Origin $host;
		add_header X-Frame-Options SAMEORIGIN;
	}

	location ~ ^(/workspace)?/bisheng|/tmp-dir {
		rewrite ^/workspace(/.*)$ $1 break;
		proxy_pass http://minio:9000;
	}
}
