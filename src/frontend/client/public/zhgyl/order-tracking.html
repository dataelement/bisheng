/* Match the workspace's light aviation palette without changing order controls. */
body.module-preview {
  --ink: #183247;
  --muted: #536b79;
  --line: #dbe5e9;
  --blue: #255b7c;
  --order-paper: #f2f6f7;
  --order-tint: #eaf3f6;
  --order-edge: #c8dbe4;
  --order-hero: radial-gradient(ellipse at 86% 48%, #c8e0ec 0%, #e4f0f6 42%, transparent 69%), linear-gradient(105deg, #fcfefe, #e8f3f8);
  background: var(--order-paper);
  color: var(--ink);
}

.module-preview .main .crumb {
  color: #536d7b;
  margin-bottom: 9px;
}

.module-preview .main :is(.head, .detail-head) {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  gap: 16px;
  min-height: 93px;
  padding: 17px 23px;
  border: 1px solid var(--order-edge);
  border-radius: 14px;
  background: var(--order-hero);
  box-shadow: 0 7px 16px -15px #183b5280;
}

.module-preview .main :is(.head, .detail-head)::after {
  position: absolute;
  z-index: -1;
  content: "";
  width: min(41%, 440px);
  height: 128px;
  right: -4%;
  bottom: -62px;
  transform: rotate(-12deg);
  border: 1px solid #729fb64d;
  border-radius: 50%;
  box-shadow: 0 0 0 16px #8db9cc20, 0 0 0 34px #98bfd01a;
  pointer-events: none;
}

.module-preview .main :is(.head, .detail-head) h1 {
  font-size: 23px;
  line-height: 32px;
  color: #153347;
  margin-bottom: 3px;
}

.module-preview .main :is(.head, .detail-head) :is(.subtitle, .detail-meta) {
  color: #425c6d;
}

.module-preview .main .date-picker {
  color: #38586c;
  background-color: #fcfeffc9;
  border: 1px solid #d0e0e8;
  border-radius: 7px;
  padding: 5px 9px;
}

.module-preview .main :is(.surface, .catalogue-summary > section, .workbench-view .node-summary-card) {
  background: #fcfdfd;
  border-color: var(--line);
  border-radius: 12px;
  box-shadow: 0 8px 19px -18px #1636487a;
}

.module-preview .main :is(.catalogue-summary > section, .workbench-view .node-summary-card) {
  border-top-color: var(--order-edge);
}

.module-preview .main :is(.summary-card-foot, .foot) {
  background: #f8fafb;
}

.module-preview .main :is(thead, .demo-alert-table thead th) {
  background: var(--order-tint);
  color: #36566a;
}

.module-preview .main .table-scroll tbody tr:hover {
  background: #f1f7f9;
}

.module-preview .main .catalogue-filters button.active,
.module-preview .main .demo-alert-filters button.active {
  border-color: var(--order-edge);
  background: var(--order-tint);
  color: #244d65;
}

.module-preview .main .btn:not(.primary) {
  border-color: var(--order-edge);
  color: #345a70;
}

.module-preview .main .btn.primary {
  color: #fff;
  border-color: #255b7c;
  background: #255b7c;
}

.module-preview .main .btn.primary:hover {
  background: #1c4864;
}

.module-preview .main :is(button, a, input, select):focus-visible {
  outline: 2px solid #3c728e;
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .module-preview .main :is(.btn, .catalogue-filters button, .demo-alert-filters button, .node-summary-card, .table-scroll tbody tr) {
    transition: background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
}

@media (max-width: 600px) {
  .module-preview .main :is(.head, .detail-head) {
    padding: 14px 15px;
    min-height: 0;
  }
}

const D=JSON.parse(document.getElementById('dataset').textContent);
const S={view:'workbench',order:null,tab:'delivery',scope:'mock',query:'',lineQuery:'',asOf:D.asOf,page:0,reminders:{},dialogOrder:null,dialogNode:'delivery'};
// Keep synthetic provenance in data/build records; business UI uses ordinary labels.
S.asOf=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
S.reminders=JSON.parse(JSON.stringify(D.initialReminders||{}));
try{const saved=JSON.parse(sessionStorage.getItem('zh-orders-empty-source-302')||JSON.stringify(S.reminders));if(saved&&typeof saved==='object'&&!Array.isArray(saved))S.reminders=saved;}catch(_){}
function persistDemoReminders(){try{sessionStorage.setItem('zh-orders-empty-source-302',JSON.stringify(S.reminders));}catch(_){}}
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=v=>v===null||v===undefined||v===''?'—':esc(v);
const number=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:4});
const date=v=>v?String(v).slice(0,10):null;
const unique=(list,key)=>Array.from(new Map(list.map(x=>[x[key],x])).values());
const calc=d=>Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(S.asOf+'T00:00:00Z'))/86400000);
const addDays=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
const title={payment:'付款',delivery:'交付',settlement:'结算'};
const find=id=>D.orders.find(o=>o.id===id);
const scopeOrders=()=>D.orders.filter(o=>S.scope==='all'||(S.scope==='mock'?o.mock:!o.mock));
const pref=(id,node)=>S.reminders[id]?.[node]||{mode:'default'};
function days(d){if(!d)return '—';const n=calc(d);return n===0?'今天':n>0?'还有 '+n+' 天':'已过 '+Math.abs(n)+' 天'}
function chip(d){const n=calc(d);return `<span class="days ${n>0?'future':n===0?'today':''}">${days(d)}</span>`}
function dateLine(d){return `<div class="date-line"><span class="date">${esc(d)}</span>${chip(d)}</div>`}
function entries(o,t){
 if(t==='payment')return o.invoices.filter(i=>date(i.due)).map(i=>({key:i.id,ref:i.number,detail:'发票号',date:date(i.due),amount:i.invoiceAmount,currency:o.mock?'人民币':null}));
 if(t==='settlement')return unique(o.settlements,'id').filter(s=>date(s.date)).map(s=>({key:s.id,ref:s.number,detail:'结算单号',date:date(s.date),amount:s.amount,currency:'人民币'}));
 return o.lines.map(l=>({key:l.id,ref:l.part,detail:l.code,material:l.material,line:l.line,date:date(l.due),quantity:l.quantity,unit:l.unit,price:l.price,amount:l.amount,currency:o.currency}));
}
function cell(o,t){const ds=Array.from(new Set(entries(o,t).map(e=>e.date).filter(Boolean))).sort();return ds.length?ds.slice(0,2).map(dateLine).join('')+(ds.length>2?`<button class="more" data-open="${o.id}" data-tab="${t}">展开 ${ds.length} 个日期 →</button>`:''):'<span class="blank">—</span><div class="order-sub">日期未提供</div>'}
function picker(){return `<span class="date-picker">截至 <time>${esc(S.asOf)}</time></span>`}
function mockBadge(){return ''}
function footer(){return ''}
function reminderText(id,node){const p=pref(id,node);return p.mode==='off'?'不再提醒':p.mode==='default'?'按规则提醒':p.next+' 再提醒'}
function adjusted(o){return Object.values(S.reminders[o.id]||{}).filter(p=>p.mode!=='default').length}
function materialCell(o){const lines=unique(o.lines,'part');const l=lines[0];return l?`<div class="material-title">${show(l.material)}</div><div class="material-part">${show(l.part)}</div>${lines.length>1?`<button class="more" data-open="${o.id}">另有 ${lines.length-1} 种规格 →</button>`:''}`:'—'}
function quantityText(o){const units=Array.from(new Set(o.lines.map(l=>l.unit)));if(units.length!==1||!units[0])return `${o.lines.length} 条明细`;return number(o.lines.reduce((n,l)=>n+Number(l.quantity||0),0))+' '+show(units[0])}
function alertData(){const alerts=[];for(const o of scopeOrders())for(const node of Object.keys(title)){const p=pref(o.id,node);if(p.mode==='off'||(p.next&&S.asOf<p.next))continue;const ds=entries(o,node).map(e=>e.date).filter(d=>d&&(p.next?S.asOf>=p.next:calc(d)>=0&&calc(d)<=7)).sort();if(ds.length)alerts.push({o,node,date:ds[0]})}return alerts.sort((a,b)=>a.date.localeCompare(b.date))}
function alerts(){const list=alertData();return `<section class="alerts" aria-label="近期提醒"><div class="alerts-top"><h2>近期提醒</h2><span class="count-dot" id="alert-count">${list.length} 项</span><span class="alerts-rule">提醒周期：到期前 7 天<button data-reset-reminders="true">重置提醒</button></span></div><div class="alerts-list">${list.length?list.slice(0,6).map(({o,node,date:d})=>`<article class="alert-item"><div class="alert-top"><b>${title[node]}日期提醒</b><span>${days(d)}</span></div><span class="alert-id">${show(o.number)}</span><p>${show(o.lines[0]?.material)} · ${show(d)}</p><button class="more" data-reminder="${o.id}" data-node="${node}" aria-label="调整 ${o.number} ${title[node]}提醒">调整提醒 →</button></article>`).join(''):'<div class="alert-empty">当前没有需要展示的近期提醒。</div>'}</div></section>`}
function scopeTabs(){return ''}
function list(){return `<div class="crumb">业务工作区 / 订单跟踪</div><div class="head"><div><h1>订单全景</h1><p class="subtitle">查看物料、数量、金额和付款、交付、结算日期。</p></div>${picker()}</div>${scopeTabs()}<section class="surface"><div class="tools"><div><strong>订单列表</strong><span class="muted" id="count"></span></div><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" aria-label="搜索订单" placeholder="搜索订单号、供应商或件号" value="${esc(S.query)}"></div></div><div class="table-scroll"><table class="orders-table"><thead><tr><th>订单 / 供应商</th><th>物料 / 件号</th><th>数量 / 金额</th><th>付款截止日<small>按付款截止日期展示</small></th><th>计划交付日期<small>合同期望计划交付日期</small></th><th>结算日期<small>约定结算日期</small></th><th>提醒</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot"><span>点击订单查看完整采购明细、金额及关联日期。</span><span>日期按自然日计算</span></div></section><div class="explain"><span class="i">i</span><p>剩余天数按自然日计算，到期当天显示“今天”。</p></div>${footer()}`}
function renderRows(){const q=S.query.trim().toLowerCase();const os=scopeOrders().filter(o=>!q||[o.number,o.supplier,...o.lines.flatMap(l=>[l.part,l.code,l.material])].join(' ').toLowerCase().includes(q));$('#rows').innerHTML=os.length?os.map(o=>`<tr><td><button class="link" data-open="${o.id}">${show(o.number)}</button>${mockBadge(o)}<div class="supplier" style="margin-top:8px">${show(o.supplier)}</div><div class="order-sub">${o.lines.length} 条采购明细</div></td><td>${materialCell(o)}</td><td><div class="money">${number(o.amount)}</div><div class="currency">${show(o.currency)}</div><div class="quantity">${quantityText(o)}</div></td><td>${cell(o,'payment')}</td><td>${cell(o,'delivery')}</td><td>${cell(o,'settlement')}</td><td class="reminder-cell"><button class="remind-btn" data-reminder="${o.id}" aria-label="设置 ${o.number} 提醒">设置提醒</button><div class="remind-sub">${adjusted(o)?adjusted(o)+' 个节点已调整':'按规则提醒'}</div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><strong>没有找到匹配订单</strong>请调整搜索条件。<br><button class="reset" data-reset="true">清空搜索</button></div></td></tr>`;$('#count').textContent=`${os.length} 笔订单 · ${os.reduce((n,o)=>n+o.lines.length,0)} 条采购明细`}
function detail(){const o=find(S.order);return `<div class="crumb"><button class="reset" data-back="true" style="padding:0;margin:0">订单全景</button> / 订单详情</div><div class="detail-head"><div class="detail-title"><button class="btn back" data-back="true" aria-label="返回订单全景">←</button><div><h1>${show(o.number)}${mockBadge(o)}</h1><p class="detail-meta">${show(o.supplier)}</p></div></div><div class="detail-actions">${picker()}<button class="btn primary" data-reminder="${o.id}">设置提醒</button></div></div><section class="surface"><div class="intro"><div><p>供应商</p><strong>${show(o.supplier)}</strong></div><div><p>客户</p><strong>${show(o.customer)}</strong></div><div><p>订单金额</p><strong class="money">${number(o.amount)}</strong><div class="detail-extra">${show(o.currency)}</div></div><div><p>采购数量</p><strong>${quantityText(o)}</strong><div class="detail-extra">${o.lines.length} 条明细</div></div></div><div class="tabs" role="tablist">${[['delivery','采购明细 / 计划交付日期'],['payment','付款截止日'],['settlement','结算日期']].map(([id,t])=>`<button class="tab ${S.tab===id?'active':''}" role="tab" aria-selected="${S.tab===id}" data-switch="${id}">${t}<span>${entries(o,id).length}</span></button>`).join('')}</div><div id="detail-rows"></div></section><p class="node-remember" id="reminder-summary"></p><div class="explain"><span class="i">i</span><p id="date-note"></p></div>${footer()}`}
function renderDetailRows(){const o=find(S.order);const all=entries(o,S.tab);const q=S.lineQuery.toLowerCase();const list=all.filter(e=>!q||[e.ref,e.detail,e.line,e.material].join(' ').toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(list.length/12));S.page=Math.max(0,Math.min(S.page,pages-1));const es=list.slice(S.page*12,(S.page+1)*12);const delivery=S.tab==='delivery';$('#detail-rows').innerHTML=`<div class="detail-toolbar"><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="detail-search" aria-label="筛选明细" placeholder="${delivery?'搜索物料、件号、编码或行号':'搜索单据号'}" value="${esc(S.lineQuery)}"></div><span class="muted">${list.length} 条记录</span></div><div class="table-scroll details"><table><thead><tr>${delivery?'<th>行号</th>':''}<th>${delivery?'物料 / 件号':S.tab==='payment'?'发票号':'结算单号'}</th>${delivery?'<th>数量</th><th>单价</th>':''}<th>${delivery?'明细金额':'单据金额'}</th><th>${title[S.tab]}日期</th><th>相差天数</th></tr></thead><tbody>${es.length?es.map(e=>`<tr>${delivery?`<td class="date">${show(e.line)}</td>`:''}<td>${delivery?`<div class="material-title">${show(e.material)}</div>`:''}<div class="part">${show(e.ref)}</div>${delivery?`<div class="order-sub">${show(e.detail)}</div>`:''}</td>${delivery?`<td>${number(e.quantity)} ${show(e.unit)}</td><td class="date">${number(e.price)}</td>`:''}<td><span class="money">${number(e.amount)}</span><div class="currency">${show(e.currency)||'—'}${!e.currency?'币种待核对':''}</div></td><td class="date">${show(e.date)}</td><td>${e.date?chip(e.date):'—'}</td></tr>`).join(''):`<tr><td colspan="8"><div class="empty"><strong>${all.length?'没有匹配明细':'暂未提供'+title[S.tab]+'日期'}</strong>${all.length?'请调整搜索条件。':'当前样本没有对应的日期记录。'}</div></td></tr>`}</tbody></table></div><div class="foot"><span>共 ${list.length} 条记录</span><div class="pager"><button data-step="-1" ${S.page===0?'disabled':''} aria-label="上一页">‹</button>${S.page+1} / ${pages}<button data-step="1" ${S.page>=pages-1?'disabled':''} aria-label="下一页">›</button></div></div>`;
$('#reminder-summary').textContent=title[S.tab]+'提醒：'+reminderText(o.id,S.tab);
$('#date-note').textContent={payment:'付款截止日以约定付款截止日为准。',delivery:'查看采购明细的计划交付日期与剩余天数。',settlement:'结算日期以约定结算日期为准。'}[S.tab]}
function workbench(){const list=alertData();const paths={payment:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',delivery:'<path d="M3 6h11v12H3zM14 10h4l3 4v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',settlement:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6"/>'};return `<section class="workbench-view"><div class="crumb">订单跟踪 / 日期预警</div><div class="head"><div><h1>预警工作台</h1><p class="subtitle">关注即将到期的付款、交付与结算日期。</p></div>${picker()}</div>${scopeTabs()}<div class="node-summary">${Object.keys(title).map(node=>{const items=list.filter(a=>a.node===node);return `<section class="node-summary-card ${node} ${items.length?'':'zero'}"><div class="summary-top"><span class="summary-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${paths[node]}</svg></span><h2>${title[node]}提醒</h2></div><div class="node-number">${items.length}<span>项待关注日期</span></div><div class="summary-card-foot"><span>${items.length?'最近日期':'未来7天'}</span><b>${items.length?items[0].date:'暂无提醒'}</b></div></section>`}).join('')}</div>${alerts()}<div class="workbench-note">到期前7天及当天展示近期提醒。可对单个节点选择7天后、30天后或不再提醒，日期和金额保持原值。</div>${footer()}</section>`}
function reminderManager(){return `<div class="crumb">订单跟踪 · 提醒管理</div><div class="head"><div><h1>提醒管理</h1><p class="subtitle">分别调整每笔订单的付款、交付和结算提醒周期。</p></div>${picker()}</div>${scopeTabs()}<section class="surface"><div class="tools"><strong>订单节点提醒</strong><button class="btn" data-reset-reminders="true">重置提醒</button></div><div class="table-scroll"><table class="manager-table"><thead><tr><th>订单 / 供应商</th><th>节点</th><th>日期</th><th>当前提醒方式</th><th>操作</th></tr></thead><tbody>${scopeOrders().flatMap(o=>Object.keys(title).map(node=>{const ds=entries(o,node).map(e=>e.date).filter(Boolean).sort();const p=pref(o.id,node);return `<tr><td><button class="link" data-open="${o.id}">${show(o.number)}</button>${mockBadge(o)}<div class="order-sub">${show(o.supplier)}</div></td><td>${title[node]}日期</td><td>${ds.length?dateLine(ds[0]):'—'}${ds.length>1?`<span class="order-sub">共 ${new Set(ds).size} 个日期</span>`:''}</td><td class="manager-setting ${p.mode!=='default'?'changed':''}">${reminderText(o.id,node)}</td><td><button class="remind-btn" data-reminder="${o.id}" data-node="${node}" aria-label="设置 ${o.number} ${title[node]}提醒">调整提醒</button></td></tr>`})).join('')}</tbody></table></div><div class="foot"><span>调整提醒不会改变订单日期、数量和金额。</span><span></span></div></section>${footer()}`}
function updateNavigation(){const active=S.order?'orders':S.view;document.querySelectorAll('.side-item,.module-nav button').forEach(el=>{el.classList.toggle('active',el.dataset.view===active);el.setAttribute('aria-current',el.dataset.view===active?'page':'false')});const count=alertData().length;$('#nav-alert-count').textContent=count;$('#bell-count').textContent=count;$('#top-date').textContent=S.asOf}
function render(){if(S.order&&!find(S.order)){S.order=null;S.dialogOrder=null;S.view='orders'}document.getElementById('main').innerHTML=S.order?detail():S.view==='workbench'?workbench():S.view==='reminders'?reminderManager():list();if(S.order)renderDetailRows();else if(S.view==='orders')renderRows();updateNavigation()}
function toast(text){const el=$('#toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.hidden=true},2800)}
function openReminder(id,node='delivery'){S.dialogOrder=id;S.dialogNode=node;const o=find(id);$('#reminder-dialog').innerHTML=`<form id="reminder-form"><div class="dialog-head"><h2 id="reminder-title">提醒设置</h2><button class="close" type="button" data-close="true" aria-label="关闭提醒设置">×</button></div><div class="dialog-body"><div class="dialog-order">${show(o.number)}${mockBadge(o)}</div><label class="field-label" for="reminder-node">提醒节点</label><select id="reminder-node" aria-label="提醒节点">${Object.keys(title).map(t=>`<option value="${t}" ${t===node?'selected':''}>${title[t]}日期</option>`).join('')}</select><div class="remind-options">${[['default','按规则提醒'],['7','7天后提醒'],['30','30天后提醒'],['off','不再提醒']].map(([v,t])=>`<label><input type="radio" name="remind" value="${v}">${t}</label>`).join('')}</div><p id="reminder-preview"></p><p class="muted" style="font-size:10px;margin-top:13px">仅调整此订单所选节点的页面提醒，不更改订单日期与金额。</p></div><div class="dialog-foot"><button class="btn" type="button" data-close="true">取消</button><button class="btn primary" type="submit">保存提醒</button></div></form>`;loadReminderChoice();$('#reminder-dialog').showModal()}
function loadReminderChoice(){const p=pref(S.dialogOrder,S.dialogNode);document.querySelector(`input[name=remind][value="${p.mode}"]`).checked=true;reminderPreview()}
function reminderPreview(){const mode=document.querySelector('input[name=remind]:checked')?.value||'default';$('#reminder-preview').textContent=mode==='off'?'停止此订单该节点的提醒；仍可在订单详情查看日期。':mode==='default'?'到期前7天、当天及逾期日期展示提醒。':`以 ${S.asOf} 为基准，${addDays(S.asOf,Number(mode))} 起重新展示提醒；之前不重复展示。`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){S.view=b.dataset.view;S.order=null;render();window.scrollTo(0,0)}
 else if(b.dataset.open){S.view='orders';S.order=b.dataset.open;S.tab=b.dataset.tab||'delivery';S.page=0;S.lineQuery='';render();window.scrollTo(0,0)}
 else if(b.dataset.back){S.order=null;render();window.scrollTo(0,0)}
 else if(b.dataset.switch){S.tab=b.dataset.switch;S.lineQuery='';S.page=0;render()}
 else if(b.dataset.step){S.page+=Number(b.dataset.step);renderDetailRows()}
 else if(b.dataset.reset){S.query='';render()}
 else if(b.dataset.scope){S.scope=b.dataset.scope;S.query='';render()}
 else if(b.dataset.reminder)openReminder(b.dataset.reminder,b.dataset.node||'delivery');
 else if(b.dataset.close)$('#reminder-dialog').close();
 else if(b.dataset.resetReminders){S.reminders={};persistDemoReminders();render();toast('已恢复默认提醒')}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.query=e.target.value;renderRows()}else if(e.target.id==='detail-search'){const pos=e.target.selectionStart;S.lineQuery=e.target.value;S.page=0;renderDetailRows();$('#detail-search').focus();$('#detail-search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='asof'&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)&&Number.isFinite(Date.parse(e.target.value))){S.asOf=e.target.value;render()}else if(e.target.id==='reminder-node'){S.dialogNode=e.target.value;loadReminderChoice()}else if(e.target.name==='remind')reminderPreview()});
document.addEventListener('submit',e=>{if(e.target.id!=='reminder-form')return;e.preventDefault();const mode=document.querySelector('input[name=remind]:checked').value;(S.reminders[S.dialogOrder]??={})[S.dialogNode]={mode,next:['7','30'].includes(mode)?addDays(S.asOf,Number(mode)):null};persistDemoReminders();$('#reminder-dialog').close();render();toast(title[S.dialogNode]+'提醒已保存')});
/* Order catalogue and date workbench. No business payment/delivery status is inferred. */
S.view='orders';S.dateFilter='all';S.listPage=0;S.alertFilter='all';S.alertNode='all';S.alertPage=0;S.managerPage=0;S.managerMode='all';
// Calendar signals never imply a business completion state.
function dateSignal(d){const n=calc(d);return n<0?'past':n===0?'today':n<=7?'soon':'future'}
chip=function(d){if(!d)return '<span class="blank">—</span>';const n=calc(d);return `<span class="days signal-${dateSignal(d)}">${n<0?'逾期 '+Math.abs(n)+' 天':n===0?'今天到期':'还有 '+n+' 天'}</span>`};
function reminderBadge(node,d){const state=dateSignal(d);const label=state==='past'?title[node]+'逾期':state==='today'?'今天到期':state==='soon'?title[node]+'临期':'待到期';return `<span class="date-signal signal-${state}"><span aria-hidden="true">●</span>${label}</span>`}
entries=function(o,t){
 if(t==='payment')return o.invoices.map(x=>({key:x.id,ref:x.number,detail:'发票号',date:date(x.due),amount:x.invoiceAmount,currency:x.currency||o.currency}));
 if(t==='settlement')return unique(o.settlements,'id').map(x=>({key:x.id,ref:x.number,detail:'结算单号',date:date(x.date),amount:x.amount,currency:o.currency}));
 return o.lines.map(l=>({key:l.id,ref:l.part,detail:l.code,material:l.material,line:l.line,date:date(l.due),quantity:l.quantity,unit:l.unit,price:l.price,amount:l.amount,currency:o.currency}));
};
const dateStates={all:'全部订单',today:'今天到期',week:'7天内到期',month:'30天内到期',future:'远期订单'};
const allDates=o=>Object.keys(title).flatMap(n=>entries(o,n).map(x=>x.date)).filter(Boolean);
const isMissing=o=>Object.keys(title).some(n=>!entries(o,n).length||entries(o,n).some(x=>!x.date))||o.lines.some(l=>!l.due);
function matchesWindow(o,kind){const ns=allDates(o).map(calc);return kind==='all'||kind==='missing'&&isMissing(o)||kind==='past'&&ns.some(n=>n<0)||kind==='today'&&ns.includes(0)||kind==='week'&&ns.some(n=>n>=0&&n<=7)||kind==='month'&&ns.some(n=>n>=0&&n<=30)||kind==='future'&&ns.some(n=>n>30)}
function aiLink(o){return '/workspace/c/new?agent=orders'+(o?'&order='+encodeURIComponent(o.number):'')}
function aiButton(o,label='询问AI'){return `<a class="btn ai-link ${o?'':'primary'}" target="_top" href="${aiLink(o)}">${label}<span aria-hidden="true"> ↗</span></a>`}
function topSummary(){const os=scopeOrders();const vendors=new Set(os.map(o=>o.supplier));const count=kind=>os.filter(o=>matchesWindow(o,kind)).length;return `<div class="catalogue-summary"><section><span>跟踪订单</span><b>${os.length}<small> 笔</small></b></section><section><span>采购金额 · 人民币</span><b>${number(os.reduce((n,o)=>n+o.amount,0))}</b></section><section><span>供应商</span><b>${vendors.size}<small> 家</small></b></section><section><span>今天 / 7天内到期</span><b>${count('today')}<small> / </small>${count('week')}<small> 笔</small></b></section></div>`}
function filterBar(){return `<div class="catalogue-filters" role="group" aria-label="订单日期筛选">${Object.entries(dateStates).map(([k,t])=>`<button class="${S.dateFilter===k?'active':''}" aria-pressed="${S.dateFilter===k}" data-date-filter="${k}">${t}<span>${scopeOrders().filter(o=>matchesWindow(o,k)).length}</span></button>`).join('')}</div>`}
list=function(){return `<div class="crumb">业务工作区 / 订单跟踪</div><div class="head"><div><h1>订单全景</h1><p class="subtitle">合同、物料与关联单据集中查看，按日期安排下一步工作。</p></div><div class="detail-actions">${picker()}${aiButton(null,'AI订单助手')}</div></div>${topSummary()}${filterBar()}<section class="surface"><div class="tools"><div><strong>订单列表</strong><span class="muted" id="count"></span></div><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" aria-label="搜索订单" placeholder="搜索订单号、供应商、客户或物料" value="${esc(S.query)}"></div></div><div class="table-scroll"><table class="orders-table rich-orders"><thead><tr><th>订单 / 供应商</th><th>物料 / 件号</th><th>数量 / 订单金额</th><th>付款截止日</th><th>计划交付日期</th><th>结算日期</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot" id="list-foot"></div></section><div class="explain"><span class="i">i</span><p>日期已过只表示日历日期已过；付款、交付与到账情况请按业务记录核对。多个日期可进入详情逐项查看。</p></div>`};
renderRows=function(){const q=S.query.trim().toLowerCase();const os=scopeOrders().filter(o=>matchesWindow(o,S.dateFilter)&&(!q||[o.number,o.supplier,o.customer,...o.lines.flatMap(l=>[l.part,l.code,l.material])].join(' ').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(os.length/8));S.listPage=Math.min(S.listPage,pages-1);const visible=os.slice(S.listPage*8,S.listPage*8+8);$('#rows').innerHTML=visible.length?visible.map(o=>`<tr><td><button class="link" data-open="${o.id}">${show(o.number)}</button><div class="supplier">${show(o.supplier)}</div><div class="order-sub">${show(o.customer)}</div><div class="order-sub">${o.lines.length}条明细</div></td><td>${materialCell(o)}</td><td><div class="money">${number(o.amount)}</div><div class="currency">${show(o.currency)}</div><div class="quantity">${quantityText(o)}</div></td><td>${cell(o,'payment')}</td><td>${cell(o,'delivery')}</td><td>${cell(o,'settlement')}</td><td><button class="remind-btn" data-reminder="${o.id}" aria-label="设置 ${o.number} 提醒">设置提醒</button><div class="remind-sub">${adjusted(o)?adjusted(o)+'个节点已调整':'按规则提醒'}</div>${aiButton(o)}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><strong>没有找到匹配订单</strong>请调整搜索或日期条件。<br><button class="reset" data-clear-catalogue="true">清空筛选</button></div></td></tr>`;$('#count').textContent=`${os.length}笔订单 · ${os.reduce((n,o)=>n+o.lines.length,0)}条采购明细`;$('#list-foot').innerHTML=`<span>本页${visible.length}笔 / 共${os.length}笔</span><div class="pager"><button data-list-step="-1" ${S.listPage===0?'disabled':''} aria-label="上一页订单">‹</button><span>${S.listPage+1} / ${pages}</span><button data-list-step="1" ${S.listPage>=pages-1?'disabled':''} aria-label="下一页订单">›</button></div>`};
detail=function(){const o=find(S.order);return `<div class="crumb"><button class="reset" data-back="true" style="padding:0;margin:0">订单全景</button> / 订单详情</div><div class="detail-head"><div class="detail-title"><button class="btn back" data-back="true" aria-label="返回订单全景">←</button><div><h1>${show(o.number)}</h1><p class="detail-meta">${show(o.supplier)}</p></div></div><div class="detail-actions">${aiButton(o)}<button class="btn primary" data-reminder="${o.id}">设置提醒</button></div></div><section class="surface"><div class="intro"><div><p>供应商</p><strong>${show(o.supplier)}</strong></div><div><p>客户</p><strong>${show(o.customer)}</strong></div><div><p>订单金额</p><strong class="money">${number(o.amount)}</strong><div class="detail-extra">${show(o.currency)}</div></div><div><p>采购数量</p><strong>${quantityText(o)}</strong><div class="detail-extra">${o.lines.length}条明细</div></div></div><div class="tabs" role="tablist">${[['delivery','采购明细 / 计划交付日期'],['payment','付款截止日'],['settlement','结算日期']].map(([id,t])=>`<button class="tab ${S.tab===id?'active':''}" role="tab" aria-selected="${S.tab===id}" data-switch="${id}">${t}<span>${entries(o,id).length}</span></button>`).join('')}</div><div id="detail-rows"></div></section><p class="node-remember" id="reminder-summary"></p><div class="explain"><span class="i">i</span><p id="date-note"></p></div>`};
alertData=function(){const list=[];for(const o of scopeOrders())for(const node of Object.keys(title)){const p=pref(o.id,node);if(p.mode==='off'||p.next&&S.asOf<p.next)continue;const ds=entries(o,node).map(x=>x.date).filter(d=>d&&(p.next?S.asOf>=p.next:calc(d)<=7)).sort();if(ds.length)list.push({o,node,date:ds[0]})}return list.sort((a,b)=>a.date.localeCompare(b.date)||a.o.number.localeCompare(b.o.number))};
function filteredAlerts(){return alertData().filter(x=>(S.alertNode==='all'||x.node===S.alertNode)&&(S.alertFilter==='all'||S.alertFilter==='past'&&calc(x.date)<0||S.alertFilter==='today'&&calc(x.date)===0||S.alertFilter==='week'&&calc(x.date)>=0&&calc(x.date)<=7))}
alerts=function(){const list=filteredAlerts(),pages=Math.max(1,Math.ceil(list.length/8));S.alertPage=Math.min(S.alertPage,pages-1);return `<section class="surface demo-alerts"><div class="tools"><div><strong>日期提醒清单</strong><span class="count-dot" id="alert-count">${list.length}项</span></div><div class="demo-alert-filters" role="group" aria-label="提醒日期筛选">${[['all','全部'],['past','逾期'],['today','今天'],['week','7天内']].map(([k,t])=>`<button data-alert-filter="${k}" class="${S.alertFilter===k?'active':''}" aria-pressed="${S.alertFilter===k}">${t}</button>`).join('')}</div></div><div class="alert-legend"><span class="legend-past">逾期</span><span class="legend-today">今天到期</span><span class="legend-soon">7天内到期</span><span class="legend-future">远期日期</span></div><div class="table-scroll"><table class="demo-alert-table"><thead><tr><th>订单 / 物料</th><th>供应商</th><th>节点与到期日</th><th>日期提醒</th><th>操作</th></tr></thead><tbody>${list.length?list.slice(S.alertPage*8,S.alertPage*8+8).map(({o,node,date:d})=>`<tr class="reminder-row-${dateSignal(d)}"><td><button class="link" data-open="${o.id}" data-tab="${node}">${show(o.number)}</button><div class="order-sub">${show(o.lines[0]?.material)} · ${show(o.lines[0]?.part)}</div></td><td class="alert-supplier">${show(o.supplier)}</td><td><b class="node-label">${title[node]} · ${show(d)}</b><div class="alert-date-detail">${chip(d)}</div></td><td>${reminderBadge(node,d)}</td><td><button class="remind-btn" data-reminder="${o.id}" data-node="${node}" aria-label="调整 ${o.number} ${title[node]}提醒">调整提醒</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="alert-empty">当前范围暂无需要关注的日期。</div></td></tr>'}</tbody></table></div><div class="foot"><span>按到期日期排序 · 逾期仅按约定日期计算</span><div class="pager"><button data-alert-step="-1" ${S.alertPage===0?'disabled':''} aria-label="上一页提醒">‹</button>${S.alertPage+1} / ${pages}<button data-alert-step="1" ${S.alertPage>=pages-1?'disabled':''} aria-label="下一页提醒">›</button></div></div></section>`};
workbench=function(){const list=alertData();const paths={payment:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',delivery:'<path d="M3 6h11v12H3zM14 10h4l3 4v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',settlement:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6"/>'};return `<section class="workbench-view"><div class="crumb">订单跟踪 / 日期预警</div><div class="head"><div><h1>预警工作台</h1><p class="subtitle">集中跟进逾期与临近到期的付款、交付和结算日期。</p></div><div class="detail-actions">${picker()}${aiButton(null,'AI订单助手')}</div></div><div class="node-summary">${Object.keys(title).map(n=>{const xs=list.filter(a=>a.node===n);return `<button class="node-summary-card ${n} ${S.alertNode===n?'selected':''}" data-alert-node="${n}" aria-pressed="${S.alertNode===n}"><div class="summary-top"><span class="summary-node-title"><svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]}</svg><h2>${title[n]}日期提醒</h2></span><span class="muted">查看清单 →</span></div><div class="node-number">${xs.length}<span>项待关注</span></div><div class="summary-signals"><span class="summary-soon"><b>${xs.filter(x=>calc(x.date)>0&&calc(x.date)<=7).length}</b> 临期</span><span class="summary-today"><b>${xs.filter(x=>calc(x.date)===0).length}</b> 今天</span><span class="summary-past"><b>${xs.filter(x=>calc(x.date)<0).length}</b> 逾期</span></div><div class="summary-card-foot"><span>${{payment:'关联供应商发票',delivery:'关联采购物料明细',settlement:'关联结算单'}[n]}</span><b>按约定日期跟进</b></div></button>`}).join('')}</div>${S.alertNode!=='all'?`<button class="reset" data-alert-node="all">查看全部节点</button>`:''}${alerts()}<p class="date-boundary-note">逾期仅表示约定日期已过，付款、交付和到账情况请以业务记录为准。</p></section>`};
reminderManager=function(){let rows=scopeOrders().flatMap(o=>Object.keys(title).map(node=>({o,node,p:pref(o.id,node)})));if(S.managerMode!=='all')rows=rows.filter(x=>x.p.mode===S.managerMode);const pages=Math.max(1,Math.ceil(rows.length/12));S.managerPage=Math.min(S.managerPage,pages-1);return `<div class="crumb">订单跟踪 / 提醒管理</div><div class="head"><div><h1>提醒管理</h1><p class="subtitle">按订单与节点管理页面提醒，日期和金额保持原值。</p></div><button class="btn" data-reset-reminders="true">重置提醒</button></div><div class="catalogue-filters" role="group" aria-label="提醒方式筛选">${[['all','全部节点'],['default','按规则提醒'],['7','7天后'],['30','30天后'],['off','不再提醒']].map(([k,t])=>`<button data-manager-mode="${k}" aria-pressed="${S.managerMode===k}" class="${S.managerMode===k?'active':''}">${t}</button>`).join('')}</div><section class="surface"><div class="tools"><strong>订单节点提醒</strong><span class="muted">${rows.length}个节点</span></div><div class="table-scroll"><table class="manager-table"><thead><tr><th>订单 / 供应商</th><th>节点</th><th>日期</th><th>当前提醒方式</th><th>操作</th></tr></thead><tbody>${rows.slice(S.managerPage*12,S.managerPage*12+12).map(({o,node,p})=>{const ds=entries(o,node).map(e=>e.date).filter(Boolean).sort();return `<tr><td><button class="link" data-open="${o.id}">${show(o.number)}</button><div class="order-sub">${show(o.supplier)}</div></td><td>${title[node]}日期</td><td>${ds.length?dateLine(ds[0]):'日期未提供'}${ds.length>1?`<div class="order-sub">共${new Set(ds).size}个日期</div>`:''}</td><td class="manager-setting ${p.mode!=='default'?'changed':''}">${reminderText(o.id,node)}</td><td><button class="remind-btn" data-reminder="${o.id}" data-node="${node}" aria-label="设置 ${o.number} ${title[node]}提醒">调整提醒</button></td></tr>`}).join('')||'<tr><td colspan="5" class="alert-empty">当前方式暂无节点。</td></tr>'}</tbody></table></div><div class="foot"><span>设置只调整对应节点的页面提醒</span><div class="pager"><button data-manager-step="-1" ${S.managerPage===0?'disabled':''} aria-label="上一页提醒设置">‹</button>${S.managerPage+1} / ${pages}<button data-manager-step="1" ${S.managerPage>=pages-1?'disabled':''} aria-label="下一页提醒设置">›</button></div></div></section>`};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let changed=true;
 if(b.dataset.dateFilter){S.dateFilter=b.dataset.dateFilter;S.listPage=0}
 else if(b.dataset.listStep){S.listPage+=Number(b.dataset.listStep)}
 else if(b.dataset.clearCatalogue){S.query='';S.dateFilter='all';S.listPage=0}
 else if(b.dataset.alertFilter){S.alertFilter=b.dataset.alertFilter;S.alertPage=0}
 else if(b.dataset.alertNode){S.alertNode=b.dataset.alertNode;S.alertPage=0}
 else if(b.dataset.alertStep){S.alertPage+=Number(b.dataset.alertStep)}
 else if(b.dataset.managerMode){S.managerMode=b.dataset.managerMode;S.managerPage=0}
 else if(b.dataset.managerStep){S.managerPage+=Number(b.dataset.managerStep)}
 else changed=false;if(changed)render();
});
let entryParams;try{entryParams=new URL(window.parent.location.href).searchParams}catch(_){entryParams=new URLSearchParams()}
const entryView=entryParams.get('view');if(['orders','workbench','reminders'].includes(entryView))S.view=entryView;
const entryOrder=entryParams.get('order');if(entryOrder&&find(entryOrder)){S.order=entryOrder;S.view='orders'}
const entryNode=entryParams.get('node'),entryMode=entryParams.get('mode');
if(S.order&&Object.keys(title).includes(entryNode)&&['default','7','30','off'].includes(entryMode))requestAnimationFrame(()=>{openReminder(S.order,entryNode);const option=document.querySelector(`input[name=remind][value="${entryMode}"]`);if(option){option.checked=true;reminderPreview()}});
function consumeReminderIntent(){try{const u=new URL(window.parent.location.href);if(u.searchParams.has('mode')){u.searchParams.delete('mode');u.searchParams.delete('node');window.parent.history.replaceState(window.parent.history.state,'',u.pathname+u.search+u.hash)}}catch(_){}}
document.addEventListener('submit',e=>{if(e.target.id==='reminder-form'&&e.defaultPrevented)consumeReminderIntent()});
document.addEventListener('click',e=>{if(e.target.closest('button[data-close]'))consumeReminderIntent()});

// Route links through the authenticated React host; the host validates origin and route.
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;let u;try{u=new URL(a.getAttribute('href').replace(/^\/workspace(?=\/)/,location.pathname.split('/zhgyl/')[0]),window.parent.location.origin)}catch(_){return}if(u.origin!==window.parent.location.origin||!u.pathname.startsWith(location.pathname.split('/zhgyl/')[0]+'/'))return;e.preventDefault();window.parent.postMessage({type:'zh-order-navigate',path:u.pathname+u.search+u.hash},window.parent.location.origin)});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.origin!==window.parent.location.origin||e.data?.type!=='zh-order-route')return;const p=e.data;let changed=false;if(['orders','workbench','reminders'].includes(p.view)){S.view=p.view;S.order=null;changed=true}if(p.order&&find(p.order)){S.order=p.order;S.view='orders';changed=true}if(changed){render();window.scrollTo(0,0)}if(S.order&&Object.keys(title).includes(p.node)&&['default','7','30','off'].includes(p.mode)){openReminder(S.order,p.node);const option=document.querySelector(`input[name=remind][value="${p.mode}"]`);if(option){option.checked=true;reminderPreview()}}});
// One host navigation serves both the module and the native assistant.
const renderOrderView=render;
render=function(){renderOrderView();try{window.parent.postMessage({type:'zh-order-view',view:S.order?'orders':S.view},window.parent.location.origin)}catch(_){}};

window.addEventListener('message',e=>{
 if(e.source!==window.parent||e.origin!==window.parent.location.origin||e.data?.type!=='zh-order-dataset')return;
 const next=e.data.dataset;if(!next||!Array.isArray(next.orders)||!next.initialReminders||typeof next.initialReminders!=='object')return;
 D.orders=next.orders;D.initialReminders=next.initialReminders;D.asOf=next.asOf;
 S.reminders=JSON.parse(JSON.stringify(D.initialReminders));
 try{const saved=JSON.parse(sessionStorage.getItem('zh-orders-empty-source-302')||'null');if(saved&&typeof saved==='object'&&!Array.isArray(saved))S.reminders=saved}catch(_){}
 const requested=new URL(window.parent.location.href).searchParams.get('order');
 if(requested&&find(requested)){S.order=requested;S.view='orders'}
 render();window.parent.postMessage({type:'zh-order-ready'},window.parent.location.origin);
});

render();
</script></body></html>
