{{- if .Values.gateway.enabled -}}
{{- if ne .Values.gateway.contractVersion "1.8.0" }}{{ fail "bundled Gateway SQL/config contract is 1.8.0; use its matching image or deliver a new versioned contract" }}{{ end -}}
{{- $host := .Values.gateway.database.host -}}{{- if not $host }}{{ $host = include "bisheng.host" (list . "mysql") }}{{ end -}}
{{- $configName := default (include "bisheng.component" (list . "gateway-config")) .Values.gateway.config.existingConfigMap -}}
{{- if not .Values.gateway.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $configName }}}
data:
  application.yml: |
    server: {port: {{ .Values.gateway.service.port }}}
    spring:
      main: {allow-bean-definition-overriding: true}
      cloud:
        gateway:
          httpclient:
            connect-timeout: 30000
            response-timeout: 3600s
          global-filter:
            websocket-routing: {enabled: false}
          routes:
            - id: bisheng-http
              uri: http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }}
              predicates: ["Path=/api/v1/**,/api/v2/**,/api/v3/**"]
              filters:
                - name: CacheRequestBody
                  args: {bodyClass: java.lang.String}
            - id: bisheng-ws
              uri: ws://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }}
              predicates: ["Path=/api/v1/chat/**,/api/v2/chat/**,/api/v1/workflow/chat/**,/api/v3/assistant/chat/**,/api/v3/workflow/chat/**"]
              filters:
                - name: CacheRequestBody
                  args: {bodyClass: java.lang.String}
      data:
        redis:
          host: {{ include "bisheng.host" (list . "redis") }}
          port: {{ .Values.redis.external.port }}
          database: {{ .Values.redis.gatewayDb }}
          password: ${GATEWAY_REDIS_PASSWORD}
      datasource:
        username: {{ .Values.gateway.database.username }}
        password: ${GATEWAY_DATABASE_PASSWORD}
        url: jdbc:mysql://{{ $host }}:{{ .Values.gateway.database.port }}/{{ .Values.gateway.database.name }}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    bisheng:
      license: ${BISHENG_LICENSE}
      gateway-hmac-secret: ${BISHENG_GATEWAY_HMAC_SECRET}
      home-url: {{ .Values.publicUrl | quote }}
      web-home-url: {{ .Values.publicUrl | quote }}
      bisheng-api-url: http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }}
      enable-sync: false
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ include "bisheng.component" (list . "gateway-sql") }}}
data:
  init.sql: {{ .Files.Get "files/gateway-init.sql" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata: {name: {{ include "bisheng.component" (list . (printf "gateway-init-%d" .Release.Revision)) }}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.bootstrap.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      {{- include "bisheng.bootstrapPlacement" . | nindent 6 }}
      automountServiceAccountToken: false
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: gateway-initialization
          image: {{ include "bisheng.image" (list . .Values.backend.image) | quote }}
          command: [python, scripts/initialize_gateway.py]
          args: [--host, {{ $host | quote }}, --port, {{ .Values.gateway.database.port | quote }}, --database, {{ .Values.gateway.database.name | quote }}, --username, {{ .Values.gateway.database.username | quote }}, --password-file, /run/database/password, --sql, /run/sql/init.sql, --timeout, {{ .Values.bootstrap.timeoutSeconds | quote }}]
          resources: {{ toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts: [{name: database, mountPath: /run/database, readOnly: true}, {name: sql, mountPath: /run/sql, readOnly: true}]
      volumes:
        - name: database
          secret:
            secretName: {{ include "bisheng.authSecret" (list . "db-gateway" .Values.gateway.database.auth) }}
            items: [{key: {{ .Values.gateway.database.auth.passwordKey }}, path: password}]
        - name: sql
          configMap: {name: {{ include "bisheng.component" (list . "gateway-sql") }}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "bisheng.component" (list . "gateway") }}}
spec:
  selector:
    {{- include "bisheng.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports: [{name: http, port: {{ .Values.gateway.service.port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "bisheng.component" (list . "gateway") }}}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bisheng.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        checksum/gateway: {{ dict "gateway" .Values.gateway "redis" .Values.redis "backend" .Values.backend "publicUrl" .Values.publicUrl | toJson | sha256sum }}
        deployment.bisheng.io/config-revision: {{ .Values.global.configRevision | quote }}
      labels:
        {{- include "bisheng.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
{{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
{{- end }}
      initContainers:
        - name: wait-gateway-schema
          image: {{ include "bisheng.image" (list . .Values.backend.image) | quote }}
          command: [python, scripts/initialize_gateway.py]
          args: [--host, {{ $host | quote }}, --port, {{ .Values.gateway.database.port | quote }}, --database, {{ .Values.gateway.database.name | quote }}, --username, {{ .Values.gateway.database.username | quote }}, --password-file, /run/database/password, --sql, /run/sql/init.sql, --timeout, {{ .Values.bootstrap.timeoutSeconds | quote }}, --wait-only]
          resources: {{ toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts: [{name: database, mountPath: /run/database, readOnly: true}, {name: sql, mountPath: /run/sql, readOnly: true}]
      containers:
        - name: gateway
          image: {{ include "bisheng.image" (list . .Values.gateway.image) | quote }}
          ports: [{name: http, containerPort: {{ .Values.gateway.service.port }}}]
          env:
            - {name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: 'file:/run/gateway/application.yml'}
            - name: GATEWAY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "bisheng.authSecret" (list . "db-gateway" .Values.gateway.database.auth) }}, key: {{ .Values.gateway.database.auth.passwordKey }}}
            - name: GATEWAY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "bisheng.authSecret" (list . "redis-auth" .Values.redis.auth) }}, key: {{ .Values.redis.auth.passwordKey }}}
            - name: BISHENG_GATEWAY_HMAC_SECRET
              valueFrom:
                secretKeyRef: {name: {{ default (include "bisheng.component" (list . "platform-keys")) .Values.global.credentials.existingPlatformSecret }}, key: gateway-hmac}
            - name: BISHENG_LICENSE
              valueFrom:
                secretKeyRef: {name: {{ required "gateway.license.existingSecret is required when enabled" .Values.gateway.license.existingSecret }}, key: {{ .Values.gateway.license.key }}}
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
          startupProbe: {{ toYaml .Values.gateway.startupProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.gateway.readinessProbe | nindent 12 }}
          livenessProbe: {{ toYaml .Values.gateway.livenessProbe | nindent 12 }}
          volumeMounts: [{name: gateway-config, mountPath: /run/gateway, readOnly: true}]
      volumes:
        - name: database
          secret:
            secretName: {{ include "bisheng.authSecret" (list . "db-gateway" .Values.gateway.database.auth) }}
            items: [{key: {{ .Values.gateway.database.auth.passwordKey }}, path: password}]
        - name: sql
          configMap: {name: {{ include "bisheng.component" (list . "gateway-sql") }}}
        - name: gateway-config
          configMap: {name: {{ $configName }}}
{{- with .Values.gateway.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.gateway.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.gateway.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
