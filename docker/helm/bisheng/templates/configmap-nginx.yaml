apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bisheng.component" (list . "nginx") }}
data:
  default.conf: |
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $bs_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
    map $http_x_forwarded_host $bs_forwarded_host { default $http_x_forwarded_host; "" $http_host; }
    server {
      listen {{ .Values.frontend.service.port }};
{{- if .Values.frontend.service.clientPort }}
      listen {{ .Values.frontend.service.clientPort }};
{{- end }}
      client_max_body_size {{ .Values.frontend.proxy.maxBodySize }};
      proxy_read_timeout {{ .Values.frontend.proxy.readTimeoutSeconds }}s;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $bs_forwarded_host;
      proxy_set_header X-Forwarded-Proto $bs_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      location / { root /usr/share/nginx/html/platform; try_files $uri $uri/ /index.html; }
      location /workspace/ { alias /usr/share/nginx/html/client/; try_files $uri $uri/ /workspace/index.html; }
      location ^~ /workspace/api/v1/internal/ { return 404; }
      location ^~ /api/v1/internal/app-runtime/ { return 404; }
      location ^~ /api/v1/internal/app-proxy/ { return 404; }
      location ^~ /internal/ { return 404; }
{{- if .Values.runtime.enabled }}
      location = /apps { proxy_pass http://{{ include "runtime.name" (list . "app-proxy") }}:8080; }
      location /apps/ { proxy_pass http://{{ include "runtime.name" (list . "app-proxy") }}:8080; proxy_buffering off; }
{{- else }}
      location /apps/ { proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }}; }
{{- end }}
      location ~ ^(/workspace)?/api(/|$) {
        rewrite ^/workspace(/.*)$ $1 break;
{{- if .Values.gateway.enabled }}
        proxy_pass http://{{ include "bisheng.component" (list . "gateway") }}:{{ .Values.gateway.service.port }};
{{- else }}
        proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }};
{{- end }}
        proxy_buffering off;
      }
      location ~ ^/(workspace/)?({{ .Values.minio.buckets.public }}|{{ .Values.minio.buckets.temporary }})/ {
        rewrite ^/workspace(/.*)$ $1 break;
        proxy_set_header Host {{ if .Values.minio.external.sharepoint }}{{ .Values.minio.external.sharepoint }}{{ else }}{{ get (urlParse .Values.publicUrl) "host" }}{{ end }};
        proxy_pass {{ if .Values.minio.external.secure }}https{{ else }}http{{ end }}://{{ include "bisheng.host" (list . "minio") }}:{{ .Values.minio.external.port }};
      }
    }
{{- if .Values.runtime.enabled }}
    server {
      listen {{ .Values.global.internalPlatformPort }} ssl;
      ssl_certificate /run/internal-tls/tls.crt;
      ssl_certificate_key /run/internal-tls/tls.key;
      client_max_body_size {{ .Values.frontend.proxy.maxBodySize }};
      proxy_read_timeout {{ .Values.frontend.proxy.readTimeoutSeconds }}s;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_request_buffering off;
      proxy_buffering off;
      location / { return 404; }
      location ^~ /api/v1/internal/app-runtime/v2/ {
        proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }};
      }
      location ^~ /api/v1/internal/app-proxy/ {
        proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }};
      }
      location ^~ /api/v2/ {
{{- if .Values.gateway.enabled }}
        proxy_pass http://{{ include "bisheng.component" (list . "gateway") }}:{{ .Values.gateway.service.port }};
{{- else }}
        proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }};
{{- end }}
      }
      location ^~ /api/v1/apps/ {
        proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }};
      }
      location ^~ /internal/app-runtime/v2/material-access/ {
        proxy_pass http://{{ include "bisheng.backendService" . }}:{{ .Values.backend.service.port }};
      }
    }
{{- end }}
