[project]
name = "bisheng-app-proxy"
version = "3.0.0"
description = "BiSheng hosted-app entry proxy — session check, header normalisation/injection, fallback pages and HTTP reverse proxy for /apps/{slug}"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "E501",   # line length — handled by the formatter
    "B008",   # FastAPI Depends() in defaults
    "B904",   # raise ... from None is too strict for existing style
    "UP007",  # Optional[X] over X | None in runtime annotations
    "RUF012", # mutable class attributes
    # Docstrings and page copy quote the Chinese product wording verbatim
    # ("无权限"、"已停用"), so ASCII-punctuation rewrites would corrupt the quote.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app_proxy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
