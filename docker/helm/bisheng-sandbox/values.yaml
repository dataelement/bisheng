# Default token is random and upgrade-stable; existingSecret is supported.
fullnameOverride: ''
nameOverride: code-runner
image:
  repository: dataelement/bisheng-sandbox
  tag: v3.1.0-beta1
  pullPolicy: IfNotPresent
  digest: ''
imagePullSecrets: []
replicaCount: 2
service:
  port: 8080
token:
  value: ''
  existingSecret: ''
  existingSecretKey: token
env:
  SANDBOX_MAX_SESSIONS: '50'
  SANDBOX_MAX_COPY_IN_TOTAL_BYTES: '536870912'
  SANDBOX_ENABLE_UID_ISOLATION: 'true'
  SANDBOX_LEASE_TTL_S: '900'
  SANDBOX_LOG_LEVEL: INFO
  TZ: Asia/Shanghai
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
securityContext:
  runAsUser: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - SETUID
    - SETGID
    - CHOWN
    - DAC_OVERRIDE
    - KILL
podSecurityContext: {}
networkPolicy:
  enabled: true
  denyEgress: false
  allowFrom: []
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
nodeSelector: {}
tolerations: []
affinity: {}
serviceAccount:
  create: false
  name: ''
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  failureThreshold: 60
