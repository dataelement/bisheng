# Application chart only. MySQL / Redis / MinIO / ES / Milvus / OpenFGA are
# expected to already exist (compose, operator, or another chart). Point the
# hosts below at those Services.

timezone: Asia/Shanghai

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: dataelement/bisheng-backend
    tag: v3.1.0-beta2
    pullPolicy: IfNotPresent
  service:
    port: 7860
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: []

worker:
  replicaCount: 1
  image:
    repository: dataelement/bisheng-backend
    tag: v3.1.0-beta2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: []

# Task-mode / Linsight worker. The image `entrypoint.sh worker` path does not
# keep this process as PID 1; run it as its own Deployment.
linsight:
  replicaCount: 1
  image:
    repository: dataelement/bisheng-backend
    tag: v3.1.0-beta2
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi
  extraEnv: []

frontend:
  objectStorageEndpoint: minio:9000
  objectStorageSharepoint: minio:9000
  replicaCount: 1
  image:
    repository: dataelement/bisheng-frontend
    tag: v3.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
    # Client SPA (base /workspace). 0 disables the extra listen/Service port.
    clientPort: 4001
    clientNodePort: null
    # Bind the node host to clientPort (single-node / no Ingress). Empty = off.
    clientHostPort: null
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  extraEnv: []

# Isolation-environment access. Token must match the bisheng-sandbox chart.
# List each replica URL. Do not point this at the ClusterIP Service.
sandbox:
  enabled: true
  token: bisheng-sandbox-local
  existingSecret: ""
  existingSecretKey: token
  endpoints:
    - http://code-runner-0.code-runner.bisheng-sandbox.svc.cluster.local:8080
    - http://code-runner-1.code-runner.bisheng-sandbox.svc.cluster.local:8080

# Externally created Secret must contain config.yaml (encrypted credentials)
# and keys.json (deployment keyring). Changing revision triggers all consumers.
credentials:
  existingSecret: ""
  configRevision: ""

secrets:
  gatewayHmacSecret: bisheng-local-hmac-20260422

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: bisheng.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: false
  size: 20Gi
  storageClass: ""

nodeSelector: {}
tolerations: []
affinity: {}
