x-runtime-platform-env: &runtime-platform-env
  BISHENG_RUNTIME_PROTOCOL_VERSION: ${BISHENG_RUNTIME_PROTOCOL_VERSION:-2}
  BISHENG_RUNTIME_NODE_ID: ${BISHENG_RUNTIME_NODE_ID:-docker-node-1}
  BISHENG_RUNTIME_PLATFORM_BASE_URL: 'http://backend:7860'
  BISHENG_RUNTIME_AUDIT_SOURCE_TIMEZONE: '${BISHENG_RUNTIME_AUDIT_SOURCE_TIMEZONE:-}'
  BISHENG_RUNTIME_OFFLINE: ${BISHENG_RUNTIME_OFFLINE:-true}
  BISHENG_RUNTIME_TASK_TIMEOUT_SECONDS: ${BISHENG_RUNTIME_TASK_TIMEOUT_SECONDS:-1800}
  BISHENG_RUNTIME_PAYLOAD_KEY: ${BISHENG_RUNTIME_PAYLOAD_KEY:-}
  BISHENG_APP_PROXY_HMAC_SECRET: ${BISHENG_APP_PROXY_HMAC_SECRET:-}
  BISHENG_APP_OBO_SECRET: ${BISHENG_APP_OBO_SECRET:-}
  BISHENG_RUNTIME_CONTROL_KEY_ID: platform-control
  BISHENG_RUNTIME_CONTROL_SECRET: ${BISHENG_RUNTIME_CONTROL_SECRET:-}
  # Generate this node descriptor on the Docker host; see deploy/runtime-manager/README.md.
  BISHENG_RUNTIME_HOST_ISOLATION_NODES: '${BISHENG_RUNTIME_HOST_ISOLATION_NODES:-}'
  BISHENG_RUNTIME_SERVICE_KEYS: '{"manager-node-1":{"secret":"${BISHENG_RUNTIME_MANAGER_SECRET:-}","node_id":"${BISHENG_RUNTIME_NODE_ID:-docker-node-1}","roles":["manager"]},"egress-node-1":{"secret":"${BISHENG_RUNTIME_EGRESS_SECRET:-}","node_id":"${BISHENG_RUNTIME_NODE_ID:-docker-node-1}","roles":["egress"]},"host-isolation-node-1":{"secret":"${BISHENG_RUNTIME_HOST_ISOLATION_SECRET:-}","node_id":"${BISHENG_RUNTIME_NODE_ID:-docker-node-1}","roles":["host-isolation"]},"entry-reader":{"secret":"${BISHENG_RUNTIME_ENTRY_SECRET:-}","roles":["entry"]}}'

services:
  gateway-db-init:
    profiles: [gateway]
    image: ${MYSQL_IMAGE:?set MYSQL_IMAGE in docker/.env (see .env.example)}
    environment:
      MYSQL_PWD: "1234"
      GATEWAY_DATABASE_PASSWORD: ${BISHENG_GATEWAY_DB_PASSWORD:-}
    volumes:
      - ./gateway/init.sql:/schema.sql:ro
      - ./gateway/init.sh:/init.sh:ro
    entrypoint: ["bash", "/init.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    profiles: [gateway]
    image: ${BISHENG_GATEWAY_IMAGE:?run bash docker/install.sh to create docker/.env}
    container_name: bisheng-gateway
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # install.sh validates these values only when the gateway profile is enabled.
      BISHENG_LICENSE: ${BISHENG_GATEWAY_LICENSE:-}
      BISHENG_GATEWAY_HMAC_SECRET: ${BISHENG_GATEWAY_HMAC_SECRET:-}
      BISHENG_PUBLIC_URL: ${BISHENG_PUBLIC_URL:-}
      GATEWAY_DATABASE_PASSWORD: ${BISHENG_GATEWAY_DB_PASSWORD:-}
      SPRING_CONFIG_LOCATION: file:/application.yml
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/gateway/config/application.yml:/application.yml:ro
      # A real user-provided file is required even with direct Compose commands.
      - type: bind
        source: ${BISHENG_GATEWAY_LICENSE_FILE:-./gateway/license.required}
        target: /run/secrets/bisheng-license
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      gateway-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: on-failure

  mysql:
    container_name: bisheng-mysql
    image: ${MYSQL_IMAGE:?set MYSQL_IMAGE in docker/.env (see .env.example)}
    
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"  # 数据库密码，如果修改需要同步修改bisheng/congfig/config.yaml配置database_url的mysql连接密码
      MYSQL_DATABASE: bisheng
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/mysql/conf/my.cnf:/etc/mysql/my.cnf
      - ${DOCKER_VOLUME_DIRECTORY:-.}/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p$$MYSQL_ROOT_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS openfga;'"]
      start_period: 30s
      interval: 20s
      timeout: 10s
      retries: 4
    restart: on-failure

  openfga-migrate:
    container_name: bisheng-openfga-migrate
    image: ${OPENFGA_IMAGE:?set OPENFGA_IMAGE in docker/.env (see .env.example)}
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: mysql
      OPENFGA_DATASTORE_URI: "root:1234@tcp(mysql:3306)/openfga?parseTime=true"
    depends_on:
      mysql:
        condition: service_healthy

  openfga:
    container_name: bisheng-openfga
    image: ${OPENFGA_IMAGE:?set OPENFGA_IMAGE in docker/.env (see .env.example)}
    command: run
    environment:
      OPENFGA_DATASTORE_METRICS_ENABLED: "true"
      OPENFGA_DATASTORE_ENGINE: mysql
      OPENFGA_DATASTORE_URI: "root:1234@tcp(mysql:3306)/openfga?parseTime=true"
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_CHECK_QUERY_CACHE_ENABLED: "true"
      OPENFGA_CHECK_QUERY_CACHE_TTL: 30s
      OPENFGA_CHECK_ITERATOR_CACHE_ENABLED: "true"
      OPENFGA_CHECK_ITERATOR_CACHE_TTL: 30s
      OPENFGA_CHECK_ITERATOR_CACHE_MAX_RESULTS: 10000
      OPENFGA_CACHE_CONTROLLER_ENABLED: "true"
      OPENFGA_CACHE_CONTROLLER_TTL: 10s
      OPENFGA_DATASTORE_MAX_OPEN_CONNS: 80
      OPENFGA_DATASTORE_MAX_IDLE_CONNS: 40
      OPENFGA_METRICS_ENABLE_RPC_HISTOGRAMS: "true"
      OPENFGA_RESOLVE_NODE_LIMIT: "${OPENFGA_RESOLVE_NODE_LIMIT:-25}"
      OPENFGA_LIST_OBJECTS_MAX_RESULTS: 1000
    ports:
      - "8080:8080"
      - "8081:8081"
      - "2112:2112"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    # 不在 compose 里写 HEALTHCHECK：openfga 官方镜像为 distroless，无 /bin/sh、无 wget，
    # CMD-SHELL 会永久 unhealthy。未定义时 Compose 将 ``service_healthy`` 视为已启动即可。
    restart: unless-stopped

  redis:
    container_name: bisheng-redis
    image: ${REDIS_IMAGE:?set REDIS_IMAGE in docker/.env (see .env.example)}
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/redis:/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/redis/redis.conf:/etc/redis.conf
    command: redis-server /etc/redis.conf
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli ping|grep -e "PONG\|NOAUTH"']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: on-failure

  backend:
    container_name: bisheng-backend
    image: ${BISHENG_BACKEND_IMAGE:?set BISHENG_BACKEND_IMAGE in docker/.env (see .env.example)}
    ports:
      - "7860:7860"
    environment:
      <<: *runtime-platform-env
      TZ: Asia/Shanghai
      BISHENG_PRO: ${BISHENG_PRO:-false}
      BISHENG_GATEWAY_HMAC_SECRET: ${BISHENG_GATEWAY_HMAC_SECRET:-}
      BS_MILVUS_CONNECTION_ARGS: '{"host":"milvus","port":"19530","user":"","password":"","secure":false}'
      BS_MILVUS_IS_PARTITION: 'true'
      BS_MILVUS_PARTITION_SUFFIX: '1'
      BS_ELASTICSEARCH_URL: 'http://elasticsearch:9200'
      BS_ELASTICSEARCH_SSL_VERIFY: '{}'  # 可根据自己部署的密码进行配置 '{"basic_auth": ("elastic", "elastic")}'
      BS_MINIO_SCHEMA: 'false'
      BS_MINIO_CERT_CHECK: 'false'
      BS_MINIO_ENDPOINT: 'minio:9000'
      BS_MINIO_SHAREPOINT: 'minio:9000'
      BS_MINIO_ACCESS_KEY: '${MINIO_ROOT_USER:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}'
      BS_MINIO_SECRET_KEY: '${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}'
      # Shared with code-runner-*; editor "run once" executes in this process.
      BS_SANDBOX_CONF__TOKEN: ${SANDBOX_TOKEN:-bisheng-sandbox-local}
      # One URL per replica. Adding code-runner-3 means appending its URL here.
      BS_SANDBOX_CONF__ENDPOINTS: '["http://code-runner-1:8080","http://code-runner-2:8080"]'
      # Run local code execution under a throwaway uid; set LOCAL_ISOLATION=off in .env to disable.
      BS_SANDBOX_CONF__LOCAL_ISOLATION: ${LOCAL_ISOLATION:-uid}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/config/config.yaml:/app/bisheng/config.yaml:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/entrypoint.sh:/app/entrypoint.sh:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/bisheng:/app/data
    security_opt:
      - seccomp:unconfined
    command: sh entrypoint.sh api  # 启动api服务
    networks:
      - default
      - sandbox_net
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      start_period: 30s
      interval: 90s
      timeout: 30s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # openfga 官方镜像无 HEALTHCHECK，Compose v5 无法用 service_healthy
      openfga:
        condition: service_started

  backend_worker:
    container_name: bisheng-backend-worker
    image: ${BISHENG_BACKEND_IMAGE:?set BISHENG_BACKEND_IMAGE in docker/.env (see .env.example)}
    environment:
      <<: *runtime-platform-env
      TZ: Asia/Shanghai
      BISHENG_PRO: ${BISHENG_PRO:-false}
      BISHENG_GATEWAY_HMAC_SECRET: ${BISHENG_GATEWAY_HMAC_SECRET:-}
      BS_MILVUS_CONNECTION_ARGS: '{"host":"milvus","port":"19530","user":"","password":"","secure":false}'
      BS_MILVUS_IS_PARTITION: 'true'
      BS_MILVUS_PARTITION_SUFFIX: '1'
      BS_ELASTICSEARCH_URL: 'http://elasticsearch:9200'
      BS_ELASTICSEARCH_SSL_VERIFY: '{}'  # 可根据自己部署的密码进行配置 '{"basic_auth": ("elastic", "elastic")}'
      BS_MINIO_SCHEMA: 'false'
      BS_MINIO_CERT_CHECK: 'false'
      BS_MINIO_ENDPOINT: 'minio:9000'
      BS_MINIO_SHAREPOINT: 'minio:9000'
      BS_MINIO_ACCESS_KEY: '${MINIO_ROOT_USER:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}'
      BS_MINIO_SECRET_KEY: '${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}'
      # Shared with code-runner-*; override SANDBOX_TOKEN in .env for non-dev.
      BS_SANDBOX_CONF__TOKEN: ${SANDBOX_TOKEN:-bisheng-sandbox-local}
      # One URL per replica. Adding code-runner-3 means appending its URL here.
      BS_SANDBOX_CONF__ENDPOINTS: '["http://code-runner-1:8080","http://code-runner-2:8080"]'
      # Run local code execution under a throwaway uid; set LOCAL_ISOLATION=off in .env to disable.
      BS_SANDBOX_CONF__LOCAL_ISOLATION: ${LOCAL_ISOLATION:-uid}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/config/config.yaml:/app/bisheng/config.yaml:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/bisheng/entrypoint.sh:/app/entrypoint.sh:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/bisheng:/app/data
    security_opt:
      - seccomp:unconfined
    command: sh entrypoint.sh worker  # 启动celery的异步worker服务，用来处理一些耗时的任务
    restart: on-failure
    networks:
      - default
      - sandbox_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      openfga:
        condition: service_started
      # Runners are not on this chain: a missing replica is 28001 at lease time,
      # not a blocked mysql/redis healthcheck.

  frontend:
    container_name: bisheng-frontend
    image: ${BISHENG_FRONTEND_IMAGE:?set BISHENG_FRONTEND_IMAGE in docker/.env (see .env.example)}
    ports:
      - "3001:3001"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ${BISHENG_NGINX_CONF_DIR:-./nginx/conf.d}:/etc/nginx/conf.d
    restart: on-failure
    depends_on:
      - backend

  elasticsearch:
    container_name: bisheng-es
    image: ${ELASTICSEARCH_IMAGE:?set ELASTICSEARCH_IMAGE in docker/.env (see .env.example)}
    user: root
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/es:/bitnami/elasticsearch/data
    restart: on-failure

  etcd:
    container_name: bisheng-milvus-etcd
    image: ${ETCD_IMAGE:?set ETCD_IMAGE in docker/.env (see .env.example)}
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: on-failure
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: bisheng-milvus-minio
    image: ${MINIO_IMAGE:?set MINIO_IMAGE in docker/.env (see .env.example)}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}
    # Object storage holds every uploaded document, knowledge-base file and
    # report template.
    #   9000 - data API. Published because the document server runs as its own
    #          compose project and cannot resolve `minio`, so BS_MINIO_SHAREPOINT
    #          has to name the host for report templates to load. Restrict it to
    #          the networks that need it and put it behind TLS.
    #   9001 - admin console, deliberately NOT published: it is a full web UI
    #          over every stored file and nothing in the stack needs it. Reach
    #          it with `ssh -L 9001:localhost:9001 <host>` when required.
    ports:
      - "9100:9000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/milvus-minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: bisheng-milvus-standalone
    image: ${MILVUS_IMAGE:?set MILVUS_IMAGE in docker/.env (see .env.example)}
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Without these Milvus falls back to its built-in minioadmin default and
      # cannot open its own segments.
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in docker/.env (see .env.example)}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/milvus:/var/lib/milvus
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      start_period: 90s
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # ── 应用工场运行时层（F054 T074 / T077 / T078）──────────────────────
  # 四个 service 都挂在 `app-runtime` profile 后面：**「整层不装」是产品明确
  # 支持的形态**（GOV-10 / AC-59）。不带 --profile app-runtime 启动时它们根本
  # 不创建，平台其余部分零变化——这正是 nginx 的 `location /apps/` 必须用
  # 变量式 upstream 的原因（静态主机名解析不了会让 nginx 整个起不来）。
  #
  # 四者都**不 publish 端口**：外部流量一律经 frontend 的 nginx 进来；
  # docker-socket-proxy 与 egress-proxy 更是连内网都只对本层可见。
  runtime-manager:
    container_name: bisheng-runtime-manager
    profiles: [app-runtime]
    image: ${BISHENG_RUNTIME_MANAGER_IMAGE:?set BISHENG_RUNTIME_MANAGER_IMAGE in docker/.env (see .env.example)}
    environment:
      TZ: Asia/Shanghai
      RTM_HOST: '0.0.0.0'
      RTM_PORT: '8091'
      RTM_PROTOCOL_VERSION: '2'
      RTM_RECONCILE_INTERVAL_SECONDS: '5'
      RTM_NODE_ID: ${BISHENG_RUNTIME_NODE_ID:-docker-node-1}
      RTM_PLATFORM_KEY_ID: manager-node-1
      RTM_PLATFORM_SECRET: ${BISHENG_RUNTIME_MANAGER_SECRET:-}
      RTM_INBOUND_KEY_ID: platform-control
      RTM_INBOUND_SECRET: ${BISHENG_RUNTIME_CONTROL_SECRET:-}
      RTM_PLATFORM_BASE_URL: 'http://backend:7860'
      RTM_DATA_ROOT: /app-data
      RTM_HOST_DATA_ROOT: ${BISHENG_APP_DATA_ROOT:-/opt/bisheng/app-data}
      RTM_DOCKER_HOST: 'tcp://docker-socket-proxy:2375'
      RTM_NETWORK: bisheng-apps
      RTM_DATA_HELPER_IMAGE: ${BISHENG_RUNTIME_MANAGER_IMAGE:?set BISHENG_RUNTIME_MANAGER_IMAGE in docker/.env (see .env.example)}
      RTM_EGRESS_PROXY: 'egress-proxy:3128'
      RTM_BUILD_NETWORK: bisheng-build
      RTM_RESERVE_MB: ${BISHENG_RTM_RESERVE_MB:-2048}
      RTM_OVERCOMMIT_RATIO: ${BISHENG_RTM_OVERCOMMIT_RATIO:-0.8}
      RTM_BUILD_RESERVE_MB: ${BISHENG_RTM_BUILD_RESERVE_MB:-2048}
      RTM_BUILD_INDEX_URL: ${BISHENG_RTM_BUILD_INDEX_URL:-}
      RTM_BUILD_NPM_REGISTRY: ${BISHENG_RTM_BUILD_NPM_REGISTRY:-}
      RTM_BUILD_EXTRA_INDEX_URL: 'http://backend:7860/api/v1/dev-toolkit/simple/'
      RTM_BUILD_EXTRA_TRUSTED_HOST: backend
      RTM_IMAGE_PULL_POLICY: ${BISHENG_RUNTIME_IMAGE_PULL_POLICY:-never}
      RTM_TASK_TIMEOUT_SECONDS: ${BISHENG_RUNTIME_TASK_TIMEOUT_SECONDS:-1800}
      RTM_CLEANUP_SECONDS: '900'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # ⚠️ docker socket **不再直挂**（D2-B，T078）：编排走
      # docker-socket-proxy 的端点白名单。全平台仍然只有那一个容器持有 socket，
      # 而它是一个没有业务代码、只做 HTTP 转发的镜像。
      # 源路径写成与 RTM_HOST_DATA_ROOT **逐字相同的表达式**，这样两者不可能漂移。
      # 不能沿用 ${DOCKER_VOLUME_DIRECTORY:-.}：它默认是相对路径 `.`，compose 自己
      # 会相对本文件解析，但作为环境变量原样传进去后 dockerd 只接受绝对路径。
      - ${BISHENG_APP_DATA_ROOT:-/opt/bisheng/app-data}:/app-data
    networks:
      # default：backend reaches the authenticated manager API.
      # bisheng-apps：启动探活是 manager 进程**直接 HTTP 访问应用容器在该网络上的
      # bridge IP**（probe.py:95），不在这张网上就永远探不通。
      - default
      - runtime-control
      - bisheng-apps
    depends_on:
      - docker-socket-proxy
    restart: on-failure

  # D2-B：把「全有全无的 root 等价权限」收成端点级。放行的端点由
  # runtime_manager.docker_backend.SOCKET_PROXY_PERMISSIONS 唯一定义，
  # tests/test_socket_proxy.py 逐字比对本段——改一边不改另一边测试就红。
  # **绝不 publish 端口**：谁够得到 2375 谁就是这台机器的 root。
  docker-socket-proxy:
    container_name: bisheng-docker-socket-proxy
    profiles: [app-runtime]
    image: ${DOCKER_SOCKET_PROXY_IMAGE:?set DOCKER_SOCKET_PROXY_IMAGE in docker/.env (see .env.example)}
    environment:
      ALLOW_RESTARTS: "0"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      AUTH: "0"
      BUILD: "1"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      NODES: "0"
      PING: "1"
      PLUGINS: "0"
      POST: "1"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "1"
      VOLUMES: "0"
    volumes:
      # :ro 只挡文件系统写，不挡 API 写——真正的收窄是上面那张表。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - runtime-control
    restart: on-failure

  # D12 L2：托管应用出站的唯一出口。它自己就是 runtime-manager 那个镜像，跑
  # separate entry point; v2 reads bounded policies from backend.
  # 它**同时**接在 bisheng-apps（--internal，应用只够得到它）与 default
  #（有默认路由，能真的出网）上——「内网 + 唯一出口」这句话的字面落点。
  egress-proxy:
    container_name: bisheng-egress-proxy
    profiles: [app-runtime]
    image: ${BISHENG_RUNTIME_MANAGER_IMAGE:?set BISHENG_RUNTIME_MANAGER_IMAGE in docker/.env (see .env.example)}
    command: ["python", "-m", "runtime_manager.egress_proxy"]
    user: '10001:10001'
    read_only: true
    environment:
      TZ: Asia/Shanghai
      RTM_PROTOCOL_VERSION: '2'
      RTM_NODE_ID: ${BISHENG_RUNTIME_NODE_ID:-docker-node-1}
      RTM_PLATFORM_KEY_ID: egress-node-1
      RTM_PLATFORM_SECRET: ${BISHENG_RUNTIME_EGRESS_SECRET:-}
      RTM_PLATFORM_BASE_URL: 'http://backend:7860'
      RTM_EGRESS_PROXY: 'egress-proxy:3128'
      RTM_EGRESS_LISTEN: '0.0.0.0:3128'
    networks: [default, bisheng-apps, bisheng-build]
    restart: on-failure

  app-proxy:
    container_name: bisheng-app-proxy
    profiles: [app-runtime]
    image: ${BISHENG_APP_PROXY_IMAGE:?set BISHENG_APP_PROXY_IMAGE in docker/.env (see .env.example)}
    environment:
      TZ: Asia/Shanghai
      APP_PROXY_HOST: '0.0.0.0'
      APP_PROXY_PORT: '8090'
      APP_PROXY_PROTOCOL_VERSION: '2'
      APP_PROXY_WS_REAUTHORIZE_INTERVAL_SECONDS: '2'
      APP_PROXY_BACKEND_BASE: 'http://backend:7860'
      APP_PROXY_BACKEND_SECRET: ${BISHENG_APP_PROXY_HMAC_SECRET:-}
      APP_PROXY_ROUTE_KEY_ID: entry-reader
      APP_PROXY_ROUTE_SECRET: ${BISHENG_RUNTIME_ENTRY_SECRET:-}
    networks:
      # default：nginx 用 `app-proxy` 这个服务名做变量式 upstream 解析
      #（docker/nginx/conf.d/default.conf:65-67），backend 也在这张网上。
      # bisheng-apps：它拿到的 upstream 是应用容器的 bridge IP（design D5.1），
      # 跨 bridge 网络会被 docker 的隔离规则丢包，必须同网。
      - default
      - bisheng-apps
    depends_on: [backend]
    restart: on-failure

  # Named replicas (not deploy.replicas). Platform endpoints list each of these.
  # No ports: — isolation is network unreachability, not hiding a host port.
  code-runner-1: &code_runner
    image: ${BISHENG_SANDBOX_IMAGE:?set BISHENG_SANDBOX_IMAGE in docker/.env (see .env.example)}
    container_name: bisheng-code-runner-1
    # Isolation mode (sessions > 1): the runner is root so it can chown/setuid per session.
    # User code still drops via SETUID. DAC_OVERRIDE is required while the runner
    # chowns the session dir at lease create (copy-in into 0700/uid 10000).
    # KILL lets the runner signal a session uid's process group on timeout / delete.
    # PID 1 is tini from the image (reaps orphans); do not add init: true.
    user: "0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    # Shared by every session on this runner; RLIMIT_CPU caps each process on top.
    # Must not exceed the host CPU count: the daemon refuses to start the
    # container otherwise (set SANDBOX_CPUS=1 on a 1-vCPU host).
    cpus: ${SANDBOX_CPUS:-2}
    pids_limit: 256
    tmpfs:
      # 0755 root:root — session uids cannot plant files in /tmp (not Docker's 1777).
      - /tmp:mode=755
    # Session work dirs and the copy-in spool live on disk, not on /tmp: tmpfs
    # pages are charged to mem_limit and are not freed by killing processes, so
    # two near-cap copy-ins (512 MiB spool + 512 MiB extracted each) would let
    # the OOM killer take the runner and every session on it.
    # Each replica needs its own directory (code-runner-2 overrides this).
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/sandbox/code-runner-1:/sessions
    # Leases live in runner memory only, so dirs left by a previous run are
    # orphans. Clear them before the runner starts (tini stays PID 1).
    command:
      - sh
      - -c
      - "find /sessions -mindepth 1 -delete || echo 'sandbox: stale session cleanup failed' >&2; exec python serve.py"
    environment:
      TZ: Asia/Shanghai
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-bisheng-sandbox-local}
      SANDBOX_SESSIONS_ROOT: /sessions
      SANDBOX_MAX_SESSIONS: "50"
      # Total bytes copied into one session (512 MiB); files past it are skipped and reported.
      SANDBOX_MAX_COPY_IN_TOTAL_BYTES: "536870912"
      SANDBOX_ENABLE_UID_ISOLATION: "true"
      SANDBOX_LEASE_TTL_S: "900"
    networks:
      - sandbox_net
    restart: on-failure

  code-runner-2:
    <<: *code_runner
    container_name: bisheng-code-runner-2
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/sandbox/code-runner-2:/sessions

# ── 托管应用专用网络 ────────────────────────────────────────────────────
# runtime-manager 只**读**这张网（docker_backend.py:161-166「网络由部署方创建」），
# 它绝不自己建——一个会偷偷建网的编排器会把"新机器上第一次发布必挂"这件事藏起来。
# 那么 compose 形态下的"部署方"就是这个文件。
#
# `name:` 必须显式写死：compose 默认会加项目名前缀（docker_bisheng-apps），而
# runtime-manager 是用裸 Docker API 建应用容器的，NetworkMode 取的是
# RTM_NETWORK / DEFAULT_NETWORK = `bisheng-apps` 这个真名，对不上就 404 network
# not found，每次 deploy 都失败。
#
# 两个 service 都显式列了 `networks:`，这是有意的：一旦给 service 写了 networks，
# 它就**不再自动接 default**，而 nginx→app-proxy、backend→runtime-manager 都靠
# default 上的服务名解析，所以两张网都得列上。
#
# `internal: true` = D12 的 L1（AC-16）。接在这张网上的容器**没有默认路由**，
# 所以托管应用连不上外网；唯一出口是同时接了 default 的 egress-proxy。
# ⚠️ 这个属性只在建网时生效：升级到本版本的环境里 `bisheng-apps` 已经存在且
# 不是 internal，compose 不会去改它，`runtime/status` 的
# `application_network_internal` 会判红并给出重建命令。删网前要先停掉全部
# 托管应用（网络在用时删不掉）。
networks:
  default:
    name: ${BISHENG_NETWORK_NAME:-bisheng-network}
    driver: bridge
  runtime-control:
    name: bisheng-runtime-control
    driver: bridge
    internal: true
  bisheng-apps:
    name: bisheng-apps
    driver: bridge
    internal: true
  # 构建期专用（RTM_BUILD_NETWORK）。同样 --internal：`docker build` 拿到的
  # HTTP_PROXY build arg 因此不是「建议」——忽略它的 Dockerfile 根本没有路由。
  # 只有 egress-proxy 在这张网上，构建容器连 runtime-manager 都够不到。
  bisheng-build:
    name: bisheng-build
    driver: bridge
    internal: true
  # User code shares the runner network namespace. Not internal, so the
  # sandbox can reach the public internet. Runners still do not join the
  # middleware network and do not publish host ports. Docker applies
  # `internal` only when the network is created; an existing internal
  # sandbox_net stays closed until it is recreated.
  sandbox_net:
    name: bisheng-sandbox
    driver: bridge
    internal: false
