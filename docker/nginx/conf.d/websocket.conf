
# 在http区域内一定要添加下面配置, 支持websocket
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

# Only a declared TLS-terminating edge may supply the public scheme.
# Add the actual outer proxy IP/CIDR here when using an external ingress.
geo $bs_trusted_edge {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
}
map "$bs_trusted_edge:$http_x_forwarded_proto" $bs_forwarded_proto {
    default $scheme;
    "1:http" http;
    "1:https" https;
}
map $http_host $bs_forwarded_host {
    default $http_host;
}

server {
	gzip on;
	gzip_comp_level  2;
	gzip_min_length  1000;
	gzip_types  text/xml text/css;
	gzip_http_version 1.1;
	gzip_vary  on;
	gzip_disable "MSIE [4-6] \.";

	listen 8443;
	location /api {
		proxy_pass http://backend:7860;
		proxy_read_timeout 300s;
		# Preserve the same public authority as the main API ingress.
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $bs_forwarded_proto;
		proxy_set_header X-Forwarded-Host $bs_forwarded_host;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		client_max_body_size 1024m;
	}
}
