{{- include "runtime.defaults" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-default-deny") }}, namespace: {{ .Values.execution.namespace }}}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-entry") }}, namespace: {{ .Values.execution.namespace }}}
spec:
  podSelector: {matchLabels: {bisheng.managed: v2}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.services.namespace }}}}
          podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "app-proxy") }}}}
      ports: [{protocol: TCP, port: http}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.services.namespace }}}}
          podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "runtime-manager") }}}}
      ports: [{protocol: TCP, port: http}, {protocol: TCP, port: data-control}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-egress-only") }}, namespace: {{ .Values.execution.namespace }}}
spec:
  podSelector: {matchLabels: {bisheng.managed: v2}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.services.namespace }}}}
          podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "egress-proxy") }}}}
      ports: [{protocol: TCP, port: 3128}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-system-default-deny") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [{{ include "runtime.name" (list . "runtime-manager") }}, {{ include "runtime.name" (list . "app-proxy") }}, {{ include "runtime.name" (list . "egress-proxy") }}, {{ include "runtime.name" (list . "runtime-admission") }}]
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-system-ingress") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "runtime-manager") }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.services.namespace }}}}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [backend, worker, linsight]}
{{- range .Values.network.controlAllowedCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 8091}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "entry-system-ingress") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "app-proxy") }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.services.namespace }}}}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend}
{{- range .Values.network.entryAllowedCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "admission-system-ingress") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "runtime-admission") }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
{{- range .Values.network.kubernetesApiCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "proxy-system-ingress") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "egress-proxy") }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.execution.namespace }}}}
          podSelector: {matchLabels: {bisheng.managed: v2}}
      ports: [{protocol: TCP, port: 3128}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-system-dns") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [{{ include "runtime.name" (list . "runtime-manager") }}, {{ include "runtime.name" (list . "app-proxy") }}, {{ include "runtime.name" (list . "egress-proxy") }}, {{ include "runtime.name" (list . "runtime-admission") }}]
  policyTypes: [Egress]
  egress:
    - to:
{{- range .Values.network.dnsCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-system-platform") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [{{ include "runtime.name" (list . "runtime-manager") }}, {{ include "runtime.name" (list . "app-proxy") }}, {{ include "runtime.name" (list . "egress-proxy") }}, {{ include "runtime.name" (list . "runtime-admission") }}]
  policyTypes: [Egress]
  egress:
    - to:
{{- range .Values.network.backendCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports:
{{- range .Values.network.backendPorts }}
        - {protocol: TCP, port: {{ . }}}
{{- end }}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.services.namespace }}}}
          podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: frontend}
      ports: [{protocol: TCP, port: {{ default .Values.network.platformPodPort (get (default (dict) .Values.global) "internalPlatformPort") }}}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "runtime-manager-cluster") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "runtime-manager") }}}}
  policyTypes: [Egress]
  egress:
    - to:
{{- range .Values.network.kubernetesApiCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
{{- end }}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.execution.namespace }}}}
          podSelector: {matchLabels: {bisheng.managed: v2}}
      ports: [{protocol: TCP, port: http}, {protocol: TCP, port: data-control}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "entry-upstream") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "app-proxy") }}}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.execution.namespace }}}}
          podSelector: {matchLabels: {bisheng.managed: v2}}
      ports: [{protocol: TCP, port: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "runtime.name" (list . "proxy-outbound") }}, namespace: {{ .Values.services.namespace }}}
spec:
  podSelector: {matchLabels: {app: {{ include "runtime.name" (list . "egress-proxy") }}}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}, {ipBlock: {cidr: "::/0"}}]
      ports:
{{- range .Values.network.egressPorts }}
        - {protocol: TCP, port: {{ . }}}
{{- end }}
