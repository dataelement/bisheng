{{- include "runtime.defaults" . -}}
{{- if eq .Values.services.namespace .Values.execution.namespace }}{{ fail "control and execution namespaces must differ" }}{{ end }}
{{- if .Values.namespaceManagement.createControl }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.services.namespace }}
  annotations: {helm.sh/resource-policy: keep}
---
{{- end }}
{{- if .Values.namespaceManagement.createExecution }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.execution.namespace }}
  annotations: {helm.sh/resource-policy: keep}
  labels:
    runtime.bisheng.io/installation: {{ .Values.execution.installationId }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.28
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime.name" (list . "runtime-manager") }}
  namespace: {{ .Values.services.namespace }}
spec:
  type: {{ .Values.services.managerType }}
  selector: {app: {{ include "runtime.name" (list . "runtime-manager") }}}
  ports:
    - {name: control, port: 8091, targetPort: 8091{{ if eq .Values.services.managerType "NodePort" }}, nodePort: {{ .Values.services.managerNodePort }}{{ end }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime.name" (list . "app-proxy") }}
  namespace: {{ .Values.services.namespace }}
spec:
  type: {{ .Values.services.entryType }}
  selector: {app: {{ include "runtime.name" (list . "app-proxy") }}}
  ports:
    - {name: http, port: 8080, targetPort: 8080{{ if eq .Values.services.entryType "NodePort" }}, nodePort: {{ .Values.services.entryNodePort }}{{ end }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime.name" (list . "egress-proxy") }}
  namespace: {{ .Values.services.namespace }}
spec:
  type: ClusterIP
  clusterIP: {{ .Values.services.egressClusterIP | quote }}
  selector: {app: {{ include "runtime.name" (list . "egress-proxy") }}}
  ports: [{name: proxy, port: 3128, targetPort: 3128}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runtime.name" (list . "runtime-admission") }}
  namespace: {{ .Values.services.namespace }}
spec:
  selector: {app: {{ include "runtime.name" (list . "runtime-admission") }}}
  ports: [{name: https, port: 443, targetPort: 8443}]
