{{- range $name := list "backend" "worker" "linsight" "beat" -}}
{{- $value := index $.Values $name -}}
{{- if and $value.cache.enabled (not $value.cache.existingClaim) }}
{{ print "\n---" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bisheng.component" (list $ (printf "%s-cache" $name)) }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [{{ $value.cache.accessMode }}]
{{- if ne (kindOf $value.cache.storageClass) "invalid" }}
  storageClassName: {{ $value.cache.storageClass | quote }}
{{- end }}
  resources: {requests: {storage: {{ $value.cache.size }}}}
{{- end -}}
{{- end -}}
