# Insert INSIDE the existing server { listen 3001; ... } block in the
# generated Gateway nginx default.conf, not at http scope or in a new server.
# The generated generic /api and websocket upstreams must still target gateway.
# Suppress query-bearing protocol logs (code/state/ticket must not be logged).
location = /api/oauth2/kunlian {
    access_log off;
    error_log /dev/null crit;
    include /etc/nginx/kunlian-protocol-proxy.inc;
}
location = /api/kunlian/callback {
    access_log off;
    error_log /dev/null crit;
    include /etc/nginx/kunlian-protocol-proxy.inc;
}
location = /api/kunlian/logout {
    access_log off;
    error_log /dev/null crit;
    include /etc/nginx/kunlian-protocol-proxy.inc;
}
location = /api/kunlian/logout/callback {
    access_log off;
    error_log /dev/null crit;
    include /etc/nginx/kunlian-protocol-proxy.inc;
}
