name: Runtime delivery images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release identifier (a new identifier for changed content)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: runtime-images-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to CR
        uses: docker/login-action@v3
        with:
          registry: cr.dataelem.com
          username: ${{ secrets.CR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CR_DOCKERHUB_TOKEN }}
      - name: Build, native isolated smoke, push and inventory
        env:
          RUNTIME_RELEASE: ${{ inputs.version || github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
          RUNTIME_PUBLISH: '1'
        run: bash scripts/build_runtime_images.sh
      - name: Native offline bundle, reuse and SQLite integration
        env:
          RUNTIME_RELEASE: ${{ inputs.version || github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work="$(mktemp -d /tmp/e2e-f059-runtime.XXXXXX)"
          trap 'sudo rm -rf "$work"' EXIT
          docker run --rm --network host --user 0:0 --env PYTHONPATH=/app \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --mount "type=bind,src=$work,dst=$work" \
            "dataelement/bisheng-runtime-manager:${RUNTIME_RELEASE}-${TARGET_ARCH}" \
            python /work/scripts/smoke_runtime_delivery.py \
              --inventory "/work/dist/runtime-images-${TARGET_ARCH}.json" --data-root "$work"
      - name: Sync verified native images to CR
        env:
          RUNTIME_RELEASE: ${{ inputs.version || github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/sync_runtime_images_cr.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-images-${{ matrix.arch }}
          path: |
            dist/runtime-images-*.json
            dist/cr/runtime-images-*.json
  catalog:
    # The job dependency includes both native smoke and Docker regression steps.
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: dockerhub
            inventory_dir: dist
            artifact: runtime-profiles
          - registry: cr
            inventory_dir: dist/cr
            artifact: runtime-profiles-cr
    runs-on: ubuntu-22.04
    env:
      CATALOG_DIR: ${{ matrix.inventory_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-images-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to CR
        if: matrix.registry == 'cr'
        uses: docker/login-action@v3
        with:
          registry: cr.dataelem.com
          username: ${{ secrets.CR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CR_DOCKERHUB_TOKEN }}
      - name: Verify matching native inventories before publishing any service index
        run: |
          python src/runtime-manager/runtime_manager/image_catalog.py merge \
            --inventory "$CATALOG_DIR/runtime-images-amd64.json" --inventory "$CATALOG_DIR/runtime-images-arm64.json" \
            --output "$CATALOG_DIR/runtime-release.json"
          python src/runtime-manager/runtime_manager/image_catalog.py indexes \
            --release-manifest "$CATALOG_DIR/runtime-release.json" > "$CATALOG_DIR/service-indexes.tsv"
      - name: Publish immutable service indexes from frozen per-platform digests
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name image amd arm; do
            if docker buildx imagetools inspect "$image" > /tmp/index-existing 2>/tmp/index-error; then
              echo "Refusing existing index $image"; exit 1
            elif grep -Eqi 'unauthorized|forbidden|denied|authentication|authorization' /tmp/index-error || \
              ! grep -Eqi 'manifest unknown|not found|no such manifest' /tmp/index-error; then
              echo 'Cannot establish index absence; publication refused' >&2; exit 1
            fi
          done < "$CATALOG_DIR/service-indexes.tsv"
          while IFS=$'\t' read -r name image amd arm; do
            docker buildx imagetools create --tag "$image" "$amd" "$arm"
            docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' > "$CATALOG_DIR/${name}-index.json"
          done < "$CATALOG_DIR/service-indexes.tsv"
          python src/runtime-manager/runtime_manager/image_catalog.py finalize \
            --release-manifest "$CATALOG_DIR/runtime-release.json" --index-dir "$CATALOG_DIR" --output "$CATALOG_DIR/runtime-release.json"
      - name: Generate both-platform application catalog
        run: python src/runtime-manager/tools/runtime_materials.py catalog --inventory "$CATALOG_DIR/runtime-images-amd64.json" --inventory "$CATALOG_DIR/runtime-images-arm64.json" --output "$CATALOG_DIR/runtime-profiles.json" --revision ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.inventory_dir }}/runtime-profiles.json
            ${{ matrix.inventory_dir }}/runtime-release.json
            ${{ matrix.inventory_dir }}/*-index.json
