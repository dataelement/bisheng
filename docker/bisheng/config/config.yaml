# 配置后以这里为准；历史版本代码里自带的默认值已作废，即使写在这里也会被忽略并改用自动生成的密钥。
# 轮换：改这里的值或删掉配置表中的记录后重启，全员需重新登录。
# 代码默认值为 ""；保持省略时使用数据库中自动生成的密钥。
