[project]
name = "bisheng-runtime-manager"
version = "3.0.0"
description = "BiSheng hosted-app runtime manager — build / lifecycle / probe / routing / capacity admission for the compose form"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    # Docker SDK is imported lazily inside runtime_manager.docker_backend so the
    # unit test suite (fake backend) never needs a daemon or the SDK installed.
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "docker: needs a real docker daemon — skipped by default, runs in the CI middleware stage and in the 114 manual verification (set RTM_RUN_DOCKER_TESTS=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "E501",   # line length — handled by the formatter
    "B008",   # FastAPI Depends() in defaults
    "B904",   # raise ... from None is too strict for existing style
    "UP007",  # Optional[X] over X | None in runtime annotations
    "RUF012", # mutable class attributes
    # Docstrings quote the Chinese product copy verbatim (state names, AC text).
    # Rewriting "待上线（资源不足）" with ASCII parens would make the quote wrong.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["runtime_manager"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
