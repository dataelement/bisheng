name: Runtime delivery images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release identifier (a new identifier for changed content)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: runtime-images-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, native smoke, push and inventory
        env:
          RUNTIME_RELEASE: ${{ inputs.version || github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/build_runtime_images.sh
      - name: Native offline bundle, reuse and SQLite integration
        env:
          RUNTIME_RELEASE: ${{ inputs.version || github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work="$(mktemp -d /tmp/e2e-f086-runtime.XXXXXX)"
          trap 'sudo rm -rf "$work"' EXIT
          docker run --rm --network host --user 0:0 --env PYTHONPATH=/app \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --mount "type=bind,src=$PWD,dst=/work,readonly" \
            --mount "type=bind,src=$work,dst=$work" \
            "dataelement/bisheng-runtime-manager:${RUNTIME_RELEASE}-${TARGET_ARCH}" \
            python /work/scripts/smoke_runtime_delivery.py \
              --inventory "/work/dist/runtime-images-${TARGET_ARCH}.json" --data-root "$work"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-images-${{ matrix.arch }}
          path: dist/runtime-images-*.json
  catalog:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-images-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish service indexes after both native jobs
        env:
          RUNTIME_RELEASE: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          for name in runtime-manager app-proxy; do
            image="dataelement/bisheng-${name}:${RUNTIME_RELEASE}"
            if docker buildx imagetools inspect "$image" > /tmp/index-existing 2>/tmp/index-error; then
              echo "Refusing existing index $image"; exit 1
            elif ! grep -Eqi 'manifest unknown|not found|no such manifest' /tmp/index-error; then
              cat /tmp/index-error >&2; exit 1
            fi
            docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          done
      - name: Generate both-platform catalog
        run: python src/runtime-manager/tools/runtime_materials.py catalog --inventory dist/runtime-images-amd64.json --inventory dist/runtime-images-arm64.json --output dist/runtime-profiles.json --revision ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-profiles
          path: dist/runtime-profiles.json
