services:
  office:
    container_name: bisheng-office
    image: ${ONLYOFFICE_IMAGE:?set ONLYOFFICE_IMAGE in docker/.env (see .env.example)}
    ports:
      - "8701:80"
    environment:
      TZ: Asia/Shanghai
      JWT_ENABLED: "false"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/office/bisheng:/var/www/onlyoffice/documentserver/sdkjs-plugins/bisheng
      - type: bind
        source: ${DOCKER_VOLUME_DIRECTORY:-.}/office/config/local-production-linux.json
        target: /etc/onlyoffice/documentserver/local-production-linux.json
        bind:
          create_host_path: false
    command: bash -c "supervisorctl restart all"
    restart: on-failure

